:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<style>
/* Layout: one friendly column (max 640px), sticky top bar, bottom tab bar, big tappable cards; each subject's color carries the wayfinding */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#151C33; --muted:#565F7C; --line:#DADFEB;
  --math:#2656C4; --rla:#A33570; --sci:#0F7049; --ss:#8F5203;
  --good:#116C3E; --bad:#B02E2E; --flag:#C98400; --onc:#FFFFFF; --scrim:rgba(16,21,40,.45);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --c:var(--math);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171F35; --ink:#ECEFF7; --muted:#9CA5C0; --line:#29324E;
    --math:#7CA3FF; --rla:#EC86B8; --sci:#52CD9A; --ss:#F2AE48;
    --good:#4FCB8A; --bad:#FF7A7A; --flag:#F5BC45; --onc:#0E1322; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171F35; --ink:#ECEFF7; --muted:#9CA5C0; --line:#29324E;
  --math:#7CA3FF; --rla:#EC86B8; --sci:#52CD9A; --ss:#F2AE48;
  --good:#4FCB8A; --bad:#FF7A7A; --flag:#F5BC45; --onc:#0E1322; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:106.25%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
a{color:var(--c);font-weight:700}
svg{display:block}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.tabbed .wrap{padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.wrap.docked{padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;min-height:62px}
.iconbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.tt{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.12rem}
.brand i svg{width:20px;height:20px}
.brand i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:.74rem;letter-spacing:.02em}
.topright{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.screen{display:flex;flex-direction:column;gap:16px}
.screen.enter{animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.65rem,7.2vw,2.25rem);line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.h1s{font-size:clamp(1.5rem,6.5vw,1.9rem)}
h2{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.label{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.mid{min-width:0;display:flex;flex-direction:column}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding-top:4px}
.hero p{margin-top:10px;color:var(--muted)}
.ring{position:relative;width:92px;height:92px}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-family:var(--body);font-weight:400;font-size:.66rem;color:var(--muted);margin-top:3px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.goalrow{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:.94rem}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.streak svg{width:18px;height:18px;color:var(--flag)}
.continue{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:0;border-radius:20px;padding:16px 18px;cursor:pointer;background:var(--c);color:var(--onc)}
.continue .eyebrow{color:var(--onc);opacity:.85}
.continue .ct{font-family:var(--display);font-weight:600;font-size:1.24rem}
.continue .cs{font-size:.88rem;opacity:.9}

.list{display:flex;flex-direction:column;gap:10px}
.subj{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer}
.glyph{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.24rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));flex:none}
.glyph.sm{font-size:.94rem}
.sname{font-weight:700;font-size:1.06rem;line-height:1.25}
.smeta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{display:block;height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,var(--surface));overflow:hidden;margin-top:8px}
.fill{display:block;height:100%;background:var(--c);border-radius:inherit}
.fill.weak{background:var(--bad)}
.chev{color:var(--muted);width:20px}
.chev svg{width:20px;height:20px}

details.info{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 18px}
details.info summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;font-weight:700}
details.info summary::-webkit-details-marker{display:none}
details.info summary .chev svg{transition:transform .2s}
details.info[open] summary .chev svg{transform:rotate(90deg)}
.facts{display:flex;flex-direction:column;gap:12px;padding-bottom:18px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.time{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.time b{display:block;font-family:var(--display);font-size:1.18rem;color:var(--c);font-variant-numeric:tabular-nums}
.time span{font-size:.82rem;color:var(--muted)}
.scale{display:flex;border-radius:12px;overflow:hidden;font-size:.76rem;font-weight:700;text-align:center}
.scale div{padding:8px 4px;flex:1}
.scale .s1{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.scale .s2{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good);flex:1.3}
.scale .s3{background:color-mix(in srgb,var(--math) 16%,var(--surface));color:var(--math)}
.scale small{display:block;font-weight:400;color:var(--muted)}
.note{border:2px dashed var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px;text-align:center}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px;font-size:.88rem;align-self:flex-start;min-height:44px}
.foot .linkbtn{align-self:center}
.linkbtn.sm{color:var(--c);padding:4px 0;font-weight:700}
.confirm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}

/* subject + lists */
.shead{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:center}
.shead .glyph{width:64px;height:64px;font-size:1.4rem}
.shead .glyph.sm{font-size:1.06rem}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.unit{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.n.done{background:var(--c);border-color:var(--c);color:var(--onc)}
.n svg{width:18px;height:18px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.ico svg{width:21px;height:21px}
.utitle{font-weight:700;line-height:1.3}
.usum{font-size:.88rem;color:var(--muted);line-height:1.4;margin-top:2px}
.chip{font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);white-space:nowrap;font-variant-numeric:tabular-nums}
.mix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:20px;padding:16px 18px;cursor:pointer}
.mix .utitle{font-size:1.06rem}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qk{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
.qk .glyph{width:44px;height:44px;border-radius:12px;font-size:1rem}
.qk .glyph.sm{font-size:.76rem}
.qk b{font-size:.94rem;line-height:1.25}
.qk small{font-size:.76rem;color:var(--muted)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.94rem}

/* lesson */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-family:var(--display);font-weight:600;font-size:1.18rem;line-height:1.25;margin:0;text-wrap:balance}
.sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ex{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:14px;padding:12px 14px;font-variant-numeric:tabular-nums;line-height:1.7}
.tip{border-radius:20px;padding:16px 18px;background:color-mix(in srgb,var(--c) 12%,var(--bg));display:flex;flex-direction:column;gap:4px}
.tip .eyebrow{display:flex;align-items:center;gap:6px}
.tip .eyebrow svg{width:16px;height:16px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.dock .in{max-width:608px;margin:0 auto}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;border:0;background:var(--c);color:var(--onc);font-weight:700;font-size:1rem;cursor:pointer;padding:0 18px;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;width:auto;font-size:.88rem;border-radius:12px;padding:0 14px}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.4;cursor:default}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 8%,var(--bg))}
.seg button{border:0;background:none;min-height:44px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:.88rem;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 20%,transparent)}
.warn{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--flag) 16%,var(--surface));font-size:.94rem}
.warn.confirm{justify-content:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:.88rem}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* quiz + test */
.qtrack{height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,var(--surface));overflow:hidden}
.qtrack div{height:100%;background:var(--c);border-radius:inherit;transition:width .3s}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:.94rem;line-height:1.65}
.passage > .eyebrow{display:block;margin-bottom:6px;color:var(--muted)}
.ph{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0 0 6px}
.qtext{font-weight:700;font-size:1.12rem;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;min-height:60px;padding:12px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);cursor:pointer;line-height:1.35}
.opt .L{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--bg);color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.opt.sel .L{background:var(--c);color:var(--onc)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.right .L{background:var(--good);color:var(--onc)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.wrong .L{background:var(--bad);color:var(--onc)}
.opt.dim{opacity:.5}
.fb{border-radius:18px;padding:16px 18px;border:2px solid;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.fb.good{border-color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb h4{margin:0;font-family:var(--display);font-weight:600;font-size:1.18rem}
.fb.good h4{color:var(--good)}
.fb.bad h4{color:var(--bad)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qnum{font-family:var(--display);font-weight:600;font-size:1.12rem;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.flag svg{width:17px;height:17px}
.flag.on{background:color-mix(in srgb,var(--flag) 20%,var(--surface));border-color:var(--flag);color:var(--ink)}
.timer{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;color:var(--ink)}
.timer svg{width:15px;height:15px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.tnav{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.3fr);gap:10px}
.tnav .btn{min-height:54px;padding:0 10px}

/* sheets */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88vh;max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet > *{flex-shrink:0}   /* sheets scroll as flex columns: without this an item with a min-height gets squashed and its contents spill or get cut off */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.shd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.cell{position:relative;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.cell.ans{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:transparent}
.cell.cur{border-color:var(--c)}
.cell.fl::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--flag)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.lg-a{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.lg-f{background:var(--flag);border-radius:50%!important}
.lg-n{border:2px solid var(--line)}

/* results */
.score{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 0 4px}
.big{font-family:var(--display);font-weight:800;font-size:3.8rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:2rem}
.miss,.rev{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ans{color:var(--good);font-weight:700;display:flex;gap:6px;align-items:flex-start}
.ans svg{width:18px;height:18px;flex:none;margin-top:3px}
.yours{color:var(--bad)}
.rev-h{display:flex;align-items:center;gap:10px}
.rnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);font-size:.85rem;font-variant-numeric:tabular-nums}
.rstat{font-weight:700;font-size:.85rem}
.rev.ok .rstat{color:var(--good)}
.rev.no .rstat{color:var(--bad)}
details.pd summary{cursor:pointer;color:var(--c);font-weight:700;font-size:.88rem}
details.pd div{margin-top:8px;font-size:.92rem;line-height:1.6;padding:12px;border-radius:12px;background:var(--bg)}
.trow{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.trow-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tnum{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .track{margin-top:6px}

/* tools */
.flash{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;min-height:300px;padding:28px 22px;border-radius:24px;border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%;box-shadow:0 10px 30px -16px color-mix(in srgb,var(--c) 55%,transparent);animation:flipin .28s ease-out}
.flash.back{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
@keyframes flipin{from{transform:perspective(800px) rotateY(60deg);opacity:.3}to{transform:none;opacity:1}}
.fterm{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.15;text-wrap:balance}
.fdef{font-size:1.18rem;line-height:1.5;text-wrap:pretty}
.fhint{font-size:.8rem;color:var(--muted)}
.frow{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0;padding-top:0}
.frow span{font-size:.85rem;color:var(--muted)}
.frow b{font-size:1.06rem;font-variant-numeric:tabular-nums}
.ebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ebtns{display:flex;gap:8px}
textarea.essay{width:100%;min-height:55vh;resize:vertical;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;line-height:1.6}
textarea.essay:focus{outline:3px solid color-mix(in srgb,var(--c) 50%,transparent);outline-offset:0}
.ck{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;cursor:pointer}
.ck input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--muted)}

/* calculator */
.calc{z-index:30}
.calcsheet{max-width:440px}
.cdisp{padding:14px 16px;border-radius:16px;background:var(--bg);text-align:right;min-height:92px;max-height:max(25vh,7.5rem);max-height:max(25dvh,7.5rem);display:flex;flex-direction:column;gap:4px;overflow-y:auto;overscroll-behavior:contain}   /* long sums scroll inside it, so the keys stay put */
#cexpr{margin-top:auto;font-size:1.6rem;font-weight:700;word-break:break-all;font-variant-numeric:tabular-nums;line-height:1.25}
#cres{color:var(--muted);min-height:1.4em;font-variant-numeric:tabular-nums}
#cres.err{color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:700;cursor:pointer}
.key.fn{font-size:1.02rem;color:var(--muted);background:var(--bg)}
.key.op{background:color-mix(in srgb,var(--math) 13%,var(--surface));color:var(--math);border-color:transparent}
.key.eq{background:var(--math);color:var(--onc);border-color:var(--math)}

/* welcome, about, backup */
.welcome{background:color-mix(in srgb,var(--math) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--math) 30%,var(--line));border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.welcome ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
textarea.code{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.4;word-break:break-all;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.okmsg{color:var(--good);font-weight:700}
.pickfile{position:relative;cursor:pointer}
.pickfile:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.filepick{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
.copies{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.copies h4{margin:6px 0 0;font-size:1rem}
.btn.copy{flex-direction:column;gap:2px}
.btn.copy small{font-weight:400;font-size:.8rem;color:var(--muted)}
.btn.armed{background:var(--bad);color:var(--onc);border-color:var(--bad)}
.btn.armed small{color:var(--onc)}
.linkbtn.armed{color:var(--bad);font-weight:700}
.errmsg{color:var(--bad);font-weight:700}
.sec .legal{font-size:.85rem;color:var(--muted)}

/* read aloud, pace, keyboard */
.listen{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink);align-self:flex-start;flex:none}
.listen svg{width:17px;height:17px}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qhead{flex-wrap:wrap}
.qhead-r{display:flex;gap:8px;align-items:center}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}
.goal .btn{align-self:flex-start}
.pace{display:flex;gap:8px;align-items:flex-start}
.pace svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--muted)}
.dateinput{min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%;max-width:260px}
.warnnote{border-style:solid;border-color:color-mix(in srgb,var(--flag) 55%,var(--line));background:color-mix(in srgb,var(--flag) 10%,var(--surface))}
.warnnote .btn{align-self:flex-start;margin-top:4px}

/* keep your progress safe: Home Screen card, backup reminders */
.note .label{margin-top:0}
.noteacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.noteacts .btn{margin-top:0}
#keepsafe{scroll-margin-top:calc(76px + env(safe-area-inset-top,0px))}

/* feedback */
a.btn{text-decoration:none}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--bg)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;word-break:break-all;user-select:all;-webkit-user-select:all}
.fb .linkbtn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:400;text-decoration:underline;align-self:flex-start;text-align:left;padding:4px 0}
.rev .linkbtn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:400;font-size:.82rem}
.linkbtn svg{width:14px;height:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke-width:2.6}

@media (prefers-reduced-motion: reduce){.screen,.flash,.overlay,.sheet{animation:none}.qtrack div{transition:none}}
</style>

<script>
"use strict";
const SUBJECTS = [
{ id:"math", name:"Math", full:"Mathematical Reasoning", glyph:"x²", color:"--math", time:"115 min",
  note:"The first few questions are no-calculator. After that you get an on-screen TI-30XS calculator and a formula sheet.",
  units:[
  { id:"m1", title:"Fractions, Decimals & Percents", sum:"Switch between forms and find percents fast.",
    lesson:[
      {h:"Three ways to write one number", html:`<p>A fraction, a decimal and a percent can all name the same amount.</p><div class="ex"><b>1/4 = 0.25 = 25%</b><br>Fraction → decimal: divide top by bottom (1 ÷ 4 = 0.25)<br>Decimal → percent: move the decimal two places right (0.25 → 25%)</div>`},
      {h:"Adding and subtracting fractions", html:`<p>Get a common denominator (same bottom number) first.</p><div class="ex">1/3 + 1/4<br>= 4/12 + 3/12<br>= <b>7/12</b></div>`},
      {h:"Multiplying and dividing fractions", html:`<ul><li><b>Multiply:</b> top × top, bottom × bottom. 2/3 × 3/5 = 6/15 = 2/5</li><li><b>Divide:</b> flip the second fraction, then multiply. 1/2 ÷ 1/4 = 1/2 × 4/1 = 2</li></ul>`},
      {h:"Percent of a number", html:`<p>Change the percent to a decimal, then multiply.</p><div class="ex">20% of 85 = 0.20 × 85 = <b>17</b></div><p><b>Percent change</b> = (new − old) ÷ old × 100. A price going from $40 to $50 is 10 ÷ 40 = a 25% increase.</p>`},
      {h:"Order of operations", html:`<p>Work in this order: Parentheses, Exponents, Multiply and Divide (left to right), then Add and Subtract (left to right). Most people remember it as <b>PEMDAS</b>.</p>`},
      {h:"Negative numbers", html:`<ul><li>Adding a negative is subtracting: 7 + (−3) = 4</li><li>Subtracting a negative is adding: 5 − (−3) = 8</li><li>Negative × negative = positive; negative × positive = negative</li></ul>`}
    ],
    tip:"Ask if your answer makes sense. 25% off should always leave you paying less than the original price.",
    quiz:[
      {q:"What is 2/5 written as a percent?", o:["40%","25%","52%","20%"], why:"2 ÷ 5 = 0.4. Move the decimal two places right: 40%."},
      {q:"A jacket costs $60 and is on sale for 25% off. What is the sale price?", o:["$45","$15","$35","$48"], why:"25% of $60 is 0.25 × 60 = $15. Subtract it: $60 − $15 = $45. ($15 is the discount, not the price.)"},
      {q:"3/4 + 1/6 = ?", o:["11/12","4/10","5/6","1"], why:"The common denominator is 12. 3/4 = 9/12 and 1/6 = 2/12, so 9/12 + 2/12 = 11/12."},
      {q:"Evaluate: 8 + 4 × 3 − 6 ÷ 2", o:["17","15","33","21"], why:"Multiply and divide first: 4 × 3 = 12 and 6 ÷ 2 = 3. Then 8 + 12 − 3 = 17."}
    ]},
  { id:"m2", title:"Ratios, Rates & Proportions", sum:"Unit prices, recipes and scale problems.",
    lesson:[
      {h:"Ratios compare amounts", html:`<p>A ratio compares two quantities. 3 nurses for every 12 patients can be written 3:12, 3 to 12, or 3/12. Simplify it like a fraction: <b>1:4</b>.</p>`},
      {h:"Unit rates", html:`<p>A unit rate tells you how much for <b>one</b>. Divide to find it.</p><div class="ex">$4.50 for 3 lb → 4.50 ÷ 3 = <b>$1.50 per lb</b></div><p>Unit rates are the fastest way to compare deals.</p>`},
      {h:"Solving proportions", html:`<p>A proportion says two ratios are equal. Cross-multiply to solve.</p><div class="ex">3/5 = x/20<br>5 · x = 3 · 20<br>5x = 60<br><b>x = 12</b></div>`},
      {h:"Scale and maps", html:`<p>If 1 inch on a map = 50 miles, then 3.5 inches = 3.5 × 50 = <b>175 miles</b>. Set it up as a proportion if you're unsure.</p>`}
    ],
    tip:"Keep units lined up. If the top of one ratio is miles, the top of the other ratio must be miles too.",
    quiz:[
      {q:"A car goes 180 miles on 6 gallons of gas. How many miles per gallon is that?", o:["30","25","36","60"], why:"Divide miles by gallons: 180 ÷ 6 = 30 miles per gallon."},
      {q:"A recipe uses 2 cups of flour for 3 dozen cookies. How much flour for 9 dozen?", o:["6 cups","4 cups","5 cups","9 cups"], why:"9 dozen is 3 times as many as 3 dozen, so triple the flour: 2 × 3 = 6 cups."},
      {q:"Solve for x: x/8 = 15/24", o:["5","3","6","45"], why:"Cross-multiply: 24x = 8 × 15 = 120. Divide: x = 120 ÷ 24 = 5."},
      {q:"Which is the better buy: 12 oz of coffee for $3.00, or 20 oz for $4.40?", o:["20 oz for $4.40","12 oz for $3.00","They cost the same per ounce","Not enough information"], why:"Unit prices: $3.00 ÷ 12 = $0.25 per oz, and $4.40 ÷ 20 = $0.22 per oz. The 20 oz bag is cheaper per ounce."}
    ]},
  { id:"m3", title:"Algebra Basics", sum:"Variables, equations and inequalities.",
    lesson:[
      {h:"Variables and expressions", html:`<p>A variable (like x) stands for an unknown number. The expression 3x + 2 means "3 times a number, plus 2."</p>`},
      {h:"Combine like terms", html:`<p>Like terms have the same variable part. Add or subtract their numbers.</p><div class="ex">5x + 2 − 3x + 7<br>= (5x − 3x) + (2 + 7)<br>= <b>2x + 9</b></div>`},
      {h:"Solve equations by undoing", html:`<p>Whatever you do to one side, do to the other. Undo adding or subtracting first, then multiplying or dividing.</p><div class="ex">4x − 5 = 19<br>4x = 24 &nbsp;(add 5 to both sides)<br><b>x = 6</b> &nbsp;(divide both sides by 4)</div>`},
      {h:"Substitution", html:`<p>To evaluate an expression, replace each letter with its value and follow the order of operations.</p><div class="ex">If x = 3: x² + 2x = 9 + 6 = <b>15</b></div>`},
      {h:"Inequalities", html:`<p>Solve them like equations, with one twist: if you multiply or divide by a <b>negative</b> number, flip the sign.</p><div class="ex">−3x &lt; 12<br>x &gt; −4 &nbsp;(divided by −3, so &lt; became &gt;)</div>`},
      {h:"Exponents and square roots", html:`<p>An exponent tells you how many times to multiply a number by itself: 2³ = 2 × 2 × 2 = 8. A square root undoes squaring: √49 = 7, because 7 × 7 = 49.</p><p>An equation like x² = 81 has <b>two</b> answers, 9 and −9, because both of them squared equal 81.</p>`},
      {h:"Factoring", html:`<p>To factor x² + bx + c, find two numbers that <b>multiply to c</b> and <b>add to b</b>.</p><div class="ex">x² + 7x + 12<br>3 × 4 = 12 and 3 + 4 = 7<br>= <b>(x + 3)(x + 4)</b></div><p>For harder ones, the quadratic formula on the formula sheet solves any equation in the form ax² + bx + c = 0.</p>`}
    ],
    tip:"Plug your answer back in to check it. If 4(6) − 5 really equals 19, you know x = 6 is right.",
    quiz:[
      {q:"Solve: 3x + 7 = 22", o:["x = 5","x = 3","x = 7","x = 9"], why:"Subtract 7 from both sides: 3x = 15. Divide by 3: x = 5."},
      {q:"Simplify: 4x + 3 − 2x + 5", o:["2x + 8","6x + 8","2x + 2","10x"], why:"Combine the x terms (4x − 2x = 2x) and the numbers (3 + 5 = 8): 2x + 8."},
      {q:"What is 2a² − b when a = 3 and b = 4?", o:["14","32","8","2"], why:"Exponent first: 3² = 9. Then 2 × 9 = 18, and 18 − 4 = 14."},
      {q:"Solve: −2x &gt; 10", o:["x &lt; −5","x &gt; −5","x &gt; 5","x &lt; 5"], why:"Divide both sides by −2. Because you divided by a negative, flip the sign: x &lt; −5."}
    ]},
  { id:"m4", title:"Lines, Slope & Graphs", sum:"Slope, y = mx + b and functions.",
    lesson:[
      {h:"The coordinate plane", html:`<p>Points are written (x, y). x tells you how far left or right; y tells you how far up or down. (0, 0) is the origin.</p>`},
      {h:"Slope", html:`<p>Slope measures steepness: rise over run.</p><div class="ex">slope = (y₂ − y₁) ÷ (x₂ − x₁)<br>From (2, 1) to (6, 9): (9 − 1) ÷ (6 − 2) = 8 ÷ 4 = <b>2</b></div><ul><li>Positive slope goes up from left to right</li><li>Negative slope goes down</li><li>A flat line has slope 0</li></ul>`},
      {h:"Slope-intercept form", html:`<p><b>y = mx + b</b>. m is the slope; b is where the line crosses the y-axis.</p><div class="ex">y = 3x − 2 → slope 3, y-intercept −2</div>`},
      {h:"Word problems as lines", html:`<p>A one-time starting amount is b. A rate per unit is m.</p><div class="ex">A plumber charges $60 to show up plus $45 an hour:<br><b>C = 45h + 60</b></div>`},
      {h:"Functions", html:`<p>A function gives exactly one output for each input. In a table, if the same x shows up with two different y values, it is not a function.</p><p><b>Function notation:</b> f(x) = 2x + 1 means "plug a number in for x." So f(4) = 2(4) + 1 = 9.</p>`},
      {h:"Parallel and perpendicular lines", html:`<ul><li><b>Parallel</b> lines never meet and have the <b>same slope</b>. y = 2x + 1 and y = 2x − 5 are parallel.</li><li><b>Perpendicular</b> lines meet at a right angle. Their slopes are negative reciprocals, like 2 and −1/2.</li></ul>`}
    ],
    tip:"The slope formula and y = mx + b are both on the GED formula sheet. Practice using them so you're not learning them on test day.",
    quiz:[
      {q:"What is the slope of the line through (1, 2) and (4, 11)?", o:["3","1/3","9","13/5"], why:"(11 − 2) ÷ (4 − 1) = 9 ÷ 3 = 3."},
      {q:"In the equation y = −2x + 5, what is the y-intercept?", o:["5","−2","2","−5"], why:"In y = mx + b, b is the y-intercept. Here b = 5. (−2 is the slope.)"},
      {q:"A gym charges $25 to join plus $15 per month. Which equation gives the total cost C after m months?", o:["C = 15m + 25","C = 25m + 15","C = 40m","C = 15(m + 25)"], why:"The $15 is charged every month, so it goes with m. The $25 is paid once, so it's the starting amount: C = 15m + 25."},
      {q:"Which point is on the line y = 3x − 1?", o:["(2, 5)","(1, 3)","(0, 1)","(3, 7)"], why:"Plug in x = 2: 3(2) − 1 = 5. So (2, 5) works. The others don't: x = 1 gives 2, x = 0 gives −1, x = 3 gives 8."}
    ]},
  { id:"m5", title:"Geometry", sum:"Area, volume, circles and right triangles.",
    lesson:[
      {h:"Perimeter and area", html:`<ul><li><b>Perimeter:</b> the distance around. Add all the sides.</li><li><b>Rectangle area</b> = length × width</li><li><b>Triangle area</b> = ½ × base × height</li></ul><div class="ex">A 12 ft × 9 ft room needs 12 × 9 = <b>108 sq ft</b> of flooring.</div>`},
      {h:"Circles", html:`<ul><li><b>Circumference</b> = 2πr (or π × diameter)</li><li><b>Area</b> = πr²</li><li>π ≈ 3.14. The radius is half the diameter.</li></ul>`},
      {h:"Volume", html:`<ul><li><b>Box (rectangular prism)</b> = length × width × height</li><li><b>Cylinder</b> = πr² × height</li></ul><p>Volume is in cubic units, like ft³ or cm³.</p>`},
      {h:"Pythagorean theorem", html:`<p>For right triangles only: <b>a² + b² = c²</b>, where c is the longest side (the hypotenuse).</p><div class="ex">Legs 3 and 4: 9 + 16 = 25, and √25 = <b>5</b></div>`}
    ],
    tip:"Sketch the shape and label what you know. The most common slip is using the diameter when the formula wants the radius.",
    quiz:[
      {q:"What is the area of a triangle with a base of 10 inches and a height of 6 inches?", o:["30 sq in","60 sq in","16 sq in","36 sq in"], why:"½ × 10 × 6 = 30. (60 is what you get if you forget the ½.)"},
      {q:"A right triangle has legs of 6 and 8. How long is the hypotenuse?", o:["10","14","12","48"], why:"6² + 8² = 36 + 64 = 100, and √100 = 10."},
      {q:"A circle has a radius of 5 cm. What is its area? (Use π ≈ 3.14)", o:["78.5 sq cm","31.4 sq cm","15.7 sq cm","25 sq cm"], why:"Area = πr² = 3.14 × 5 × 5 = 3.14 × 25 = 78.5 sq cm. (31.4 is the circumference.)"},
      {q:"A storage box is 4 ft long, 3 ft wide and 2 ft tall. What is its volume?", o:["24 cubic ft","9 cubic ft","26 cubic ft","12 cubic ft"], why:"Volume = length × width × height = 4 × 3 × 2 = 24 cubic feet."}
    ]},
  { id:"m6", title:"Data, Statistics & Probability", sum:"Mean, median, mode and chances.",
    lesson:[
      {h:"Mean, median, mode, range", html:`<ul><li><b>Mean:</b> add them up, divide by how many</li><li><b>Median:</b> the middle value once sorted (average the two middle values if there's an even count)</li><li><b>Mode:</b> the value that shows up most</li><li><b>Range:</b> biggest minus smallest</li></ul>`},
      {h:"Reading charts", html:`<p>Check the title, the axis labels and the scale before you read any values. Bar graphs compare groups, line graphs show change over time, and circle graphs show parts of a whole.</p>`},
      {h:"Probability", html:`<p>Probability = favorable outcomes ÷ total outcomes. It's always between 0 (impossible) and 1 (certain).</p><div class="ex">Rolling a 5 on a die: 1/6<br>Rolling an even number: 3/6 = <b>1/2</b></div>`},
      {h:"Two events in a row", html:`<p>For events that don't affect each other, multiply. Flipping heads twice: ½ × ½ = <b>¼</b>.</p>`}
    ],
    tip:"Always sort the numbers before finding the median. Skipping that step is the most common mistake.",
    quiz:[
      {q:"What is the mean of 4, 8, 10, 6 and 12?", o:["8","10","6","40"], why:"Add them: 4 + 8 + 10 + 6 + 12 = 40. Divide by 5 numbers: 40 ÷ 5 = 8."},
      {q:"What is the median of 3, 9, 4, 7, 2, 8?", o:["5.5","4","7","5"], why:"Sort first: 2, 3, 4, 7, 8, 9. With six numbers, average the middle two: (4 + 7) ÷ 2 = 5.5."},
      {q:"A bag holds 3 red, 5 blue and 2 green marbles. What's the probability of pulling out a blue one?", o:["1/2","1/5","5/3","1/3"], why:"There are 5 blue out of 10 total marbles. 5/10 = 1/2."},
      {q:"Test scores: 70, 85, 85, 90, 95. What is the mode?", o:["85","70","25","90"], why:"The mode is the value that appears most often. 85 appears twice. (25 is the range.)"}
    ]}
  ]},
{ id:"rla", name:"Language Arts", full:"Reasoning Through Language Arts", glyph:"Aa", color:"--rla", time:"150 min",
  note:"Reading passages, grammar questions built into passages, and a 45-minute essay called the Extended Response.",
  units:[
  { id:"r1", title:"Main Idea & Details", sum:"Find the big point and what supports it.",
    lesson:[
      {h:"What is the main idea?", html:`<p>The main idea is the one point the whole passage is making. It's often near the beginning or end, but sometimes you have to put it together yourself.</p>`},
      {h:"Supporting details", html:`<p>Details are facts, examples and reasons that back up the main idea. Ask yourself: does this sentence prove or explain the big point?</p>`},
      {h:"Summarizing", html:`<p>A good summary is short, uses your own words and includes only the main points. It leaves out small details and your personal opinion.</p>`},
      {h:"How a passage is built", html:`<p>Notice the structure: cause and effect, problem and solution, compare and contrast, or time order. Signal words give it away:</p><div class="ex"><i>because, as a result</i> → cause and effect<br><i>however, on the other hand</i> → contrast<br><i>first, then, finally</i> → time order</div>`}
    ],
    tip:"Read the question before the passage. You'll know what to look for while you read.",
    quiz:[
      {p:`Community gardens have spread across many cities over the past decade. Residents who once had no space to grow food now share small plots in empty lots. Studies have linked these gardens to fresher diets, stronger ties between neighbors, and even lower crime on nearby blocks. For many neighborhoods, a garden is more than a place to grow tomatoes.`,
       q:"Which sentence best states the main idea of the passage?", o:["Community gardens bring neighborhoods benefits beyond food.","Tomatoes are the most popular crop in community gardens.","Empty lots in cities are dangerous.","Studies about community gardens are unreliable."], why:"Every detail (diets, neighbors, crime) supports the idea that gardens do more than grow food. The last sentence says it directly."},
      {p:`Community gardens have spread across many cities over the past decade. Residents who once had no space to grow food now share small plots in empty lots. Studies have linked these gardens to fresher diets, stronger ties between neighbors, and even lower crime on nearby blocks. For many neighborhoods, a garden is more than a place to grow tomatoes.`,
       q:"Which detail supports the idea that gardens help people connect?", o:["Stronger ties between neighbors","They have spread over the past decade","Residents once had no space to grow food","Plots are located in empty lots"], why:"\"Stronger ties between neighbors\" is the only detail about people connecting with each other."},
      {q:"Which of these belongs in a good summary?", o:["The main points, in your own words","Every detail from the passage","Your opinion about the topic","Long quotes copied from the text"], why:"A summary is short and covers only the main points in your own words. It leaves out minor details and opinions."}
    ]},
  { id:"r2", title:"Inference, Tone & Purpose", sum:"Read between the lines.",
    lesson:[
      {h:"Making inferences", html:`<p>An inference is a smart conclusion based on clues in the text plus what you already know. It isn't stated directly, but the text must support it.</p>`},
      {h:"Author's purpose", html:`<ul><li><b>Inform:</b> give facts (news, manuals)</li><li><b>Persuade:</b> convince you (editorials, ads)</li><li><b>Entertain:</b> tell a story</li><li><b>Explain:</b> show how or why something works</li></ul>`},
      {h:"Tone", html:`<p>Tone is the author's attitude: hopeful, critical, angry, neutral, funny. Look at word choice. "The plan failed miserably" feels very different from "The plan did not succeed."</p>`},
      {h:"Words in context", html:`<p>When you hit an unfamiliar word, look at the sentences around it. Definitions, examples and contrasts nearby often reveal the meaning.</p>`}
    ],
    tip:"On inference questions, wrong answers usually go too far. Pick the choice the text clearly supports, not the most dramatic one.",
    quiz:[
      {p:`Maria checked the clock for the fourth time in ten minutes. She smoothed her blazer, reread the notes in her folder, and practiced her handshake on the empty air. When the receptionist finally called her name, she took a deep breath and stood up.`,
       q:"What can you infer about Maria?", o:["She is nervous before a job interview.","She is late for a movie.","She is the receptionist's boss.","She is bored at home."], why:"The clues (checking the clock, blazer, notes, practicing a handshake, a receptionist calling her name) point to a nervous job candidate."},
      {q:"A newspaper editorial urges voters to approve money for a new library. What is the author's main purpose?", o:["To persuade","To inform","To entertain","To describe"], why:"Editorials try to convince readers. \"Urges voters\" is a strong sign the purpose is to persuade."},
      {q:"\"The hike was arduous; by the end, our legs ached and we needed long breaks.\" What does arduous most likely mean?", o:["Difficult","Short","Beautiful","Boring"], why:"The clues after the semicolon (aching legs, long breaks) show the hike was hard."}
    ]},
  { id:"r3", title:"Arguments & Evidence", sum:"Judge claims, evidence and weak reasoning.",
    lesson:[
      {h:"Claim, evidence, reasoning", html:`<p>An argument has a <b>claim</b> (what the author wants you to believe), <b>evidence</b> (facts, data, expert quotes, examples) and <b>reasoning</b> that connects the two.</p>`},
      {h:"Fact vs. opinion", html:`<p>A fact can be checked and proven. An opinion is a belief or judgment. Words like <i>best, should, terrible</i> and <i>I think</i> often signal opinions.</p>`},
      {h:"Judging evidence", html:`<p>Strong evidence is relevant, specific and from a credible source. Weak evidence is a personal story, a vague claim, or an emotional appeal with nothing behind it.</p>`},
      {h:"Faulty reasoning", html:`<ul><li><b>Overgeneralizing:</b> "My two friends liked it, so everyone will."</li><li><b>Either/or:</b> pretending there are only two options</li><li><b>Attacking the person</b> instead of their idea</li></ul>`},
      {h:"Comparing two texts", html:`<p>The test often gives you two passages on the same topic. Compare their claims, their evidence and how convincing each one is.</p>`}
    ],
    tip:"This lesson is also the key to the essay, which asks you to judge which of two arguments is better supported.",
    quiz:[
      {q:"Which statement is a fact, not an opinion?", o:["The city council voted 6–3 to approve the budget.","This is the best budget the city has ever had.","Residents should be thankful for the new budget.","Property taxes are far too high."], why:"A vote count can be checked in public records. The others are judgments (best, should, too high)."},
      {q:"Claim: \"Schools should start later because teens need more sleep.\" Which is the strongest support?", o:["A study of 9,000 students found later start times improved attendance and grades.","My cousin hates waking up early.","Everyone knows teenagers are lazy.","Early mornings are dark and gloomy."], why:"The study is specific, large and relevant. The others are a personal story, a stereotype and a feeling."},
      {q:"\"Everyone I know loves this phone, so it must be the best phone on the market.\" What is the flaw in this reasoning?", o:["It generalizes from a small, limited group.","It uses too many statistics.","It attacks a competitor.","It cites an expert."], why:"The people one person knows aren't enough to prove what's best for everyone. That's overgeneralizing."}
    ]},
  { id:"r4", title:"Grammar & Language", sum:"Agreement, run-ons and confusing words.",
    lesson:[
      {h:"Subject-verb agreement", html:`<p>Singular subjects take singular verbs. Watch for words between the subject and the verb.</p><div class="ex">The box of tools <b>is</b> in the truck.<br>(The subject is box, not tools.)</div><p>Each, every, everyone and nobody are singular.</p><p>With <i>either/or</i> and <i>neither/nor</i>, the verb matches the subject closest to it: "Neither the manager nor the <b>workers were</b> told."</p>`},
      {h:"Complete sentences", html:`<ul><li><b>Fragment:</b> missing a subject or verb. "Because I was late."</li><li><b>Run-on:</b> two sentences jammed together. "I was late I missed the bus."</li><li><b>Comma splice:</b> two sentences joined with only a comma.</li></ul><p>Fix run-ons with a period, a semicolon, or a comma plus and/but/so.</p>`},
      {h:"Commonly confused words", html:`<ul><li><b>its</b> (belongs to it) vs. <b>it's</b> (it is)</li><li><b>their</b> (belongs to them), <b>there</b> (a place), <b>they're</b> (they are)</li><li><b>your</b> vs. <b>you're</b> (you are)</li><li><b>affect</b> (verb: to influence) vs. <b>effect</b> (noun: a result)</li><li><b>then</b> (time) vs. <b>than</b> (comparing)</li></ul>`},
      {h:"Transitions", html:`<p>Transition words show how ideas connect: <i>however</i> (contrast), <i>as a result</i> (effect), <i>for example</i> (example), <i>in addition</i> (adding on).</p>`},
      {h:"Pronouns and apostrophes", html:`<ul><li>Use <b>I, he, she, we, they</b> as the subject: "Marcus and I left early."</li><li>Use <b>me, him, her, us, them</b> after verbs and words like <i>to, for, with</i>: "She called Marcus and me."</li><li>One worker's badge → add <b>'s</b>. Several workers' badges → the word already ends in s, so add just <b>'</b>.</li></ul><p>Quick check: drop the other person. "Me left early" sounds wrong, so it's "Marcus and I."</p>`},
      {h:"Parallel structure and modifiers", html:`<p><b>Parallel structure:</b> items in a list should match in form. "I like hiking, swimming and cooking" (not "to cook").</p><p><b>Dangling modifiers:</b> an opening phrase must describe the word right after the comma. "Running for the bus, my bag fell open" says the bag was running. Fix: "Running for the bus, I dropped my bag."</p>`}
    ],
    tip:"On the test these show up as drop-down menus inside a passage. Read the whole sentence with each choice before you pick.",
    quiz:[
      {q:"Each of the workers ___ a safety badge.", o:["has","have","having","are having"], why:"\"Each\" is singular, so it takes the singular verb \"has.\" Don't let \"workers\" fool you."},
      {q:"The company updated ___ website last week.", o:["its","it's","its'","it is"], why:"\"Its\" shows possession (the website belongs to it). \"It's\" means \"it is.\""},
      {q:"Which correctly fixes this run-on? \"I finished my shift I drove home.\"", o:["I finished my shift, and I drove home.","I finished my shift, I drove home.","I finished my shift and, I drove home.","I finished, my shift I drove home."], why:"A comma plus \"and\" correctly joins two complete sentences. Using only a comma creates a comma splice."},
      {q:"The store raised its prices. ___, many customers began shopping elsewhere.", o:["As a result","However","For example","In contrast"], why:"Customers leaving is an effect of the price increase, so \"As a result\" fits."}
    ]},
  { id:"r5", title:"Writing the Essay", sum:"Plan and write the Extended Response.",
    lesson:[
      {h:"What the task asks", html:`<p>The Extended Response gives you passages arguing opposite sides of an issue. You have <b>45 minutes</b> to explain which argument is <b>better supported</b>. Your personal opinion on the topic doesn't matter.</p>`},
      {h:"How it's scored", html:`<p>Graders look at three things:</p><ul><li>How well you analyze the arguments and use evidence from the passages</li><li>How clearly your essay is developed and organized</li><li>How well you use standard English</li></ul>`},
      {h:"A simple structure", html:`<ul><li><b>Intro:</b> name the issue and state which side is better supported (your thesis)</li><li><b>Body 1–2:</b> show the stronger side's best evidence and why it works</li><li><b>Body 3:</b> point out the weaker side's flaws</li><li><b>Conclusion:</b> restate your thesis in new words</li></ul>`},
      {h:"Time plan", html:`<div class="ex">10 min: read both passages and plan<br>25 min: write<br>10 min: reread and fix errors</div>`}
    ],
    tip:"Point to specific evidence. \"Passage A cites a five-year study of 2,000 workers\" beats \"Passage A has good facts.\"",
    quiz:[
      {q:"In the Extended Response, what is your main job?", o:["Explain which argument is better supported, using evidence from the passages","Share your personal opinion on the issue","Summarize both passages equally","Write a story about the topic"], why:"The essay is about judging the arguments, not about what you personally believe."},
      {q:"Which is the strongest thesis statement?", o:["Passage A makes the stronger case because it backs its claims with research and expert testimony, while Passage B relies on personal stories.","Both passages make some good points.","I agree with Passage B because I like its topic.","This essay will talk about two passages."], why:"A strong thesis takes a clear position and says why, pointing to the kind of evidence each side uses."},
      {q:"How long do you have for the Extended Response?", o:["45 minutes","25 minutes","60 minutes","90 minutes"], why:"The essay portion of the Language Arts test is 45 minutes."}
    ]}
  ]},
{ id:"sci", name:"Science", full:"Science", glyph:"H₂O", glyphSm:true, color:"--sci", time:"90 min",
  note:"Mostly reading passages, charts and experiments. An on-screen calculator is available.",
  units:[
  { id:"s1", title:"Life Science", sum:"Cells, genetics, ecosystems and evolution.",
    lesson:[
      {h:"Cells", html:`<p>Cells are the basic unit of life.</p><ul><li><b>Nucleus:</b> holds DNA and controls the cell</li><li><b>Mitochondria:</b> release energy from food</li><li><b>Cell membrane:</b> controls what goes in and out</li><li>Plant cells also have a <b>cell wall</b> and <b>chloroplasts</b> for photosynthesis</li></ul>`},
      {h:"Photosynthesis and respiration", html:`<p>Plants use sunlight, water and carbon dioxide to make glucose (sugar) and release oxygen. Cellular respiration does the reverse: it uses glucose and oxygen to release energy, carbon dioxide and water.</p>`},
      {h:"Genetics", html:`<p>Genes come in versions called alleles. A <b>dominant</b> allele (B) shows up with just one copy. A <b>recessive</b> allele (b) only shows up with two copies (bb).</p><div class="ex">Bb × Bb gives: BB, Bb, Bb, bb<br>3 out of 4 show the dominant trait<br>1 out of 4 (<b>25%</b>) show the recessive trait</div>`},
      {h:"Ecosystems", html:`<p><b>Producers</b> (plants) make their own food. <b>Consumers</b> eat other living things. <b>Decomposers</b> (fungi, bacteria) break down dead material. Only about 10% of energy passes from one level of a food chain to the next.</p>`},
      {h:"Evolution", html:`<p>In natural selection, organisms with traits that help them survive and reproduce pass those traits on. Over many generations, the population changes.</p>`},
      {h:"Body systems and health", html:`<ul><li><b>Circulatory</b> (heart, blood): carries oxygen and nutrients to cells</li><li><b>Respiratory</b> (lungs): brings in oxygen, removes carbon dioxide</li><li><b>Digestive:</b> breaks food down into nutrients</li><li><b>Nervous</b> (brain, nerves): sends signals through the body</li><li><b>Immune:</b> fights infections</li></ul><p>Bacteria are living cells; viruses need a host cell to copy themselves. <b>Antibiotics work on bacteria, not viruses.</b></p>`}
    ],
    tip:"Most science questions are about reading the passage or chart in front of you. Knowing these terms just makes the reading faster.",
    quiz:[
      {q:"Which part of a plant cell carries out photosynthesis?", o:["Chloroplast","Mitochondria","Nucleus","Cell membrane"], why:"Chloroplasts capture sunlight and make glucose. Mitochondria release energy from that food."},
      {q:"Brown fur (B) is dominant over white fur (b). Two Bb parents have offspring. What is the chance an offspring has white fur?", o:["25%","0%","50%","75%"], why:"Bb × Bb gives BB, Bb, Bb, bb. Only bb shows the recessive white fur: 1 out of 4, or 25%."},
      {q:"In the food chain grass → rabbit → fox, the rabbit is a…", o:["Primary consumer","Producer","Secondary consumer","Decomposer"], why:"The rabbit eats the producer (grass), which makes it the first-level, or primary, consumer."},
      {q:"Which statement best describes natural selection?", o:["Organisms with helpful traits are more likely to survive and pass those traits on.","Organisms change their traits on purpose to survive.","All organisms in a species have identical traits.","Traits an animal learns are passed to its offspring."], why:"Natural selection works on traits organisms already have. Those that help survival get passed on more often."}
    ]},
  { id:"s2", title:"Physical Science", sum:"Matter, force, motion and energy.",
    lesson:[
      {h:"Matter", html:`<p>Matter is anything with mass. It exists as solids, liquids and gases. Atoms make up elements, and elements bond to form compounds, like H₂O (water).</p><p><b>Density</b> = mass ÷ volume. Something denser than water (1 g/cm³) sinks; something less dense floats.</p>`},
      {h:"Physical vs. chemical change", html:`<p>A <b>physical change</b> changes form but not what it's made of (melting ice, tearing paper). A <b>chemical change</b> makes a new substance (burning, rusting, cooking an egg). Signs of a chemical change: gas, heat, light or a color change.</p>`},
      {h:"Motion and force", html:`<ul><li><b>Speed</b> = distance ÷ time</li><li><b>Newton's 1st law:</b> objects keep doing what they're doing unless a force acts on them (inertia)</li><li><b>Newton's 2nd law:</b> Force = mass × acceleration (F = ma)</li><li><b>Newton's 3rd law:</b> every action has an equal and opposite reaction</li></ul><p><b>Friction</b> is a force that works against motion. It's why a rolling ball eventually stops.</p>`},
      {h:"Energy", html:`<p><b>Kinetic</b> energy is energy of motion. <b>Potential</b> energy is stored energy, like a rock at the top of a hill. Energy can change form but is never created or destroyed.</p>`},
      {h:"Heat transfer", html:`<ul><li><b>Conduction:</b> through direct contact (a hot pan handle)</li><li><b>Convection:</b> through moving liquids or gases (warm air rising)</li><li><b>Radiation:</b> through waves (sunlight)</li></ul>`}
    ],
    tip:"When a science question needs a formula, it's usually given to you. Your job is to plug in the right numbers.",
    quiz:[
      {q:"How much force is needed to accelerate a 10 kg cart at 3 m/s²?", o:["30 N","3.3 N","13 N","300 N"], why:"F = m × a = 10 × 3 = 30 newtons."},
      {q:"Which of these is a chemical change?", o:["Burning wood","Melting ice","Cutting paper","Dissolving sugar in water"], why:"Burning creates new substances (ash, smoke, gases). The others change form but not what the material is."},
      {q:"A runner covers 400 meters in 80 seconds. What is her average speed?", o:["5 m/s","0.2 m/s","320 m/s","32,000 m/s"], why:"Speed = distance ÷ time = 400 ÷ 80 = 5 meters per second."},
      {q:"A ball resting at the top of a hill has mostly which kind of energy?", o:["Potential energy","Kinetic energy","Thermal energy","Sound energy"], why:"It isn't moving yet, so its energy is stored because of its height. That's potential energy."}
    ]},
  { id:"s3", title:"Earth & Space", sum:"Plates, cycles, weather and seasons.",
    lesson:[
      {h:"Earth's structure", html:`<p>Earth has a crust, mantle, outer core and inner core. The crust is broken into <b>tectonic plates</b> that slowly move. Where plates meet, you get earthquakes, mountains and volcanoes.</p>`},
      {h:"Hotspots", html:`<p>Some volcanoes form over a <b>hotspot</b>, a plume of hot material rising from deep in the mantle. As a plate slides over it, a chain of islands forms. The Hawaiian Islands are the classic example.</p>`},
      {h:"Cycles", html:`<p><b>Water cycle:</b> evaporation → condensation → precipitation → collection.<br><b>Rock cycle:</b> igneous, sedimentary and metamorphic rocks change into one another over long periods of time.</p><ul><li><b>Igneous:</b> forms when melted rock (magma or lava) cools</li><li><b>Sedimentary:</b> layers of sand, mud and shells pressed together</li><li><b>Metamorphic:</b> changed by heat and pressure</li></ul>`},
      {h:"Weather, climate and seasons", html:`<p><b>Weather</b> is day-to-day conditions; <b>climate</b> is the long-term pattern. Seasons happen because Earth's axis is tilted, so each half of the planet gets more direct sunlight at different times of year.</p>`},
      {h:"Resources", html:`<p><b>Renewable</b> resources refill naturally (sun, wind, water). <b>Nonrenewable</b> resources take millions of years to form (coal, oil, natural gas).</p>`},
      {h:"Earth in space", html:`<ul><li>Earth <b>rotates</b> on its axis once a day, causing day and night</li><li>Earth <b>orbits</b> the sun once a year</li><li>The moon's <b>phases</b> come from seeing different amounts of its sunlit half as it orbits Earth</li><li>The moon's gravity is the main cause of ocean <b>tides</b></li><li>The sun is a star at the center of our solar system</li></ul>`}
    ],
    tip:"Seasons are NOT caused by Earth getting closer to the sun. That's a classic trick answer.",
    quiz:[
      {q:"What causes Earth's seasons?", o:["The tilt of Earth's axis","Earth's changing distance from the sun","The phases of the moon","Changes in cloud cover"], why:"The tilt means each hemisphere gets more direct sunlight for part of the year (summer) and less for another part (winter)."},
      {q:"Which energy source is renewable?", o:["Wind","Coal","Natural gas","Oil"], why:"Wind keeps blowing naturally. Coal, natural gas and oil took millions of years to form and will run out."},
      {q:"The Hawaiian Islands formed mainly from…", o:["Volcanoes over a hotspot","Glaciers carving rock","Two plates colliding","Rivers depositing sand"], why:"The Pacific Plate moves over a hotspot, building a chain of volcanic islands over time."},
      {q:"Water vapor cooling to form clouds is called…", o:["Condensation","Evaporation","Precipitation","Collection"], why:"Condensation is when a gas cools into a liquid, like water droplets forming clouds."}
    ]},
  { id:"s4", title:"Experiments & Data", sum:"Variables, hypotheses and graphs.",
    lesson:[
      {h:"The scientific method", html:`<p>Ask a question → form a hypothesis → test it → analyze the data → draw a conclusion. A hypothesis must be <b>testable</b>, often written as "If…, then…"</p>`},
      {h:"Variables", html:`<ul><li><b>Independent variable:</b> what you change on purpose</li><li><b>Dependent variable:</b> what you measure</li><li><b>Constants:</b> everything you keep the same</li><li><b>Control group:</b> the group with no treatment, used for comparison</li></ul><p><b>Reliable results</b> come from repeating trials, using larger samples and changing only one variable at a time.</p>`},
      {h:"Reading graphs and tables", html:`<p>Check the title, labels and units first. Then look for the trend: does one value rise as the other rises, fall, or show no pattern?</p>`},
      {h:"Correlation vs. causation", html:`<p>Two things happening together doesn't prove one causes the other. Ice cream sales and sunburns both rise in summer, but ice cream doesn't cause sunburn. Hot, sunny weather drives both.</p>`}
    ],
    tip:"A big share of the science test is reading experiments and data. If you can name the variables, you're halfway there.",
    quiz:[
      {q:"A student gives plants different amounts of fertilizer and measures how tall they grow. What is the independent variable?", o:["The amount of fertilizer","The height of the plants","The type of soil","The amount of sunlight"], why:"The independent variable is what the student changes on purpose: the fertilizer. Plant height is what's measured (dependent)."},
      {q:"What is the purpose of a control group?", o:["To give a baseline to compare results against","To make the experiment faster","To test a second hypothesis","To increase the number of variables"], why:"The control group gets no treatment, so you can see what difference the treatment actually made."},
      {p:`<b>Sugar that dissolves in 100 mL of water</b><br>20°C → 200 g<br>40°C → 240 g<br>60°C → 290 g<br>80°C → 360 g`,
       q:"Which statement best describes the data?", o:["As water temperature rises, more sugar dissolves.","As water temperature rises, less sugar dissolves.","Temperature has no effect on dissolving sugar.","Sugar only dissolves above 60°C."], why:"Every time the temperature goes up, the amount of sugar that dissolves goes up too."},
      {q:"Which hypothesis can be tested?", o:["If plants get more sunlight, they will grow taller.","Plants are the most beautiful living things.","Plants have feelings about music.","Sunlight is better than rain."], why:"Only the first one makes a prediction you can measure (sunlight and plant height)."}
    ]}
  ]},
{ id:"ss", name:"Social Studies", full:"Social Studies", glyph:"1776", glyphSm:true, color:"--ss", time:"70 min",
  note:"About half the questions are civics and government. Expect maps, charts and historical documents.",
  units:[
  { id:"ss1", title:"Civics & Government", sum:"Branches, the Constitution and your rights.",
    lesson:[
      {h:"Start here", html:`<p>Civics and government make up about half of the Social Studies test, so this is the unit to know best.</p>`},
      {h:"Three branches", html:`<ul><li><b>Legislative</b> (Congress: the Senate and House): makes laws</li><li><b>Executive</b> (the President): carries out laws, can veto bills</li><li><b>Judicial</b> (the Supreme Court and federal courts): interprets laws and can strike down unconstitutional ones</li></ul><p>Each state has <b>2 senators</b>. The House has <b>435</b> members, with seats based on each state's population.</p>`},
      {h:"Checks and balances", html:`<p>Each branch can limit the others. The President can veto a bill; Congress can override a veto with a two-thirds vote; courts can rule a law unconstitutional (judicial review); the Senate confirms judges. The House can <b>impeach</b> (formally charge) an official, and the Senate holds the trial.</p>`},
      {h:"The Constitution", html:`<p>Written in 1787, it begins "We the People," showing that power comes from the people (<b>popular sovereignty</b>). <b>Federalism</b> splits power between the national and state governments. The <b>Bill of Rights</b> is the first 10 amendments: free speech, religion, press, a fair trial and more.</p><div class="ex"><b>Federal powers:</b> print money, declare war (Congress), make treaties<br><b>State powers:</b> driver's licenses, run elections, public schools<br><b>Shared:</b> collect taxes, set up courts</div>`},
      {h:"Key amendments", html:`<ul><li><b>13th:</b> ended slavery</li><li><b>14th:</b> citizenship and equal protection under the law</li><li><b>15th:</b> voting rights regardless of race</li><li><b>19th:</b> women's right to vote</li><li><b>26th:</b> voting age lowered to 18</li></ul>`},
      {h:"Rights and responsibilities", html:`<p>The U.S. is a <b>representative democracy</b>: citizens elect officials to make laws for them. The <b>First Amendment</b> protects freedom of religion, speech, the press, assembly and petition.</p><p>Citizens also have responsibilities, like serving on a jury when called, paying taxes and obeying laws.</p><p>A bill becomes law after it passes <b>both</b> the House and the Senate and is signed by the President (or Congress overrides a veto).</p>`}
    ],
    tip:"When a question describes one branch limiting another, the answer is almost always checks and balances.",
    quiz:[
      {q:"Which branch of government interprets the laws?", o:["Judicial","Legislative","Executive","State"], why:"The courts, led by the Supreme Court, decide what laws mean and whether they follow the Constitution."},
      {q:"The President vetoes a bill, and Congress overrides the veto with a two-thirds vote. This is an example of…", o:["Checks and balances","Federalism","Popular sovereignty","Judicial review"], why:"One branch (Congress) is limiting the power of another (the President). That's checks and balances."},
      {q:"Which amendment gave women the right to vote?", o:["19th","13th","15th","26th"], why:"The 19th Amendment, ratified in 1920, protected women's right to vote."},
      {q:"What is the Bill of Rights?", o:["The first ten amendments to the Constitution","The Declaration of Independence","A list of laws passed by Congress each year","The rules for electing the President"], why:"The Bill of Rights is the first 10 amendments, protecting freedoms like speech, religion and a fair trial."}
    ]},
  { id:"ss2", title:"U.S. History", sum:"From 1776 to the Civil Rights Movement.",
    lesson:[
      {h:"Founding", html:`<p>The Declaration of Independence (1776) explained why the colonies were breaking from Britain. It says people have rights to "Life, Liberty and the pursuit of Happiness." The Revolutionary War followed, then the Constitution in 1787.</p>`},
      {h:"Civil War and Reconstruction", html:`<p>The Civil War (1861–1865) was fought mainly over slavery and its spread. Lincoln's Emancipation Proclamation (1863) declared enslaved people in Confederate states free. After the war, the 13th, 14th and 15th Amendments were passed during Reconstruction.</p>`},
      {h:"Industry and the World Wars", html:`<p>Factories, railroads and immigration transformed the country in the late 1800s, and many people moved from farms to cities (<b>urbanization</b>). Leaders like Susan B. Anthony fought for women's right to vote, which the 19th Amendment secured in 1920.</p><p>The U.S. fought in World War I (1917–1918) and World War II (1941–1945). Japan's attack on Pearl Harbor on December 7, 1941, brought the U.S. into World War II.</p>`},
      {h:"Great Depression and the New Deal", html:`<p>The stock market crash of 1929 led to the Great Depression. President Franklin D. Roosevelt's New Deal created jobs programs and Social Security.</p>`},
      {h:"Civil Rights Movement", html:`<ul><li><b>Brown v. Board of Education</b> (1954): segregated public schools are unconstitutional</li><li><b>Montgomery Bus Boycott</b> (1955–1956)</li><li><b>March on Washington</b> (1963), where Martin Luther King Jr. gave his "I Have a Dream" speech</li><li><b>Civil Rights Act</b> (1964) and <b>Voting Rights Act</b> (1965)</li></ul>`},
      {h:"Cold War", html:`<p>After World War II, the U.S. and the Soviet Union competed for power without fighting each other directly, until the Soviet Union broke up in 1991.</p>`}
    ],
    tip:"You won't have to recite dates. You'll read a source and explain it. The timeline just gives you context.",
    quiz:[
      {q:"What was the main purpose of the Declaration of Independence?", o:["To explain why the colonies were separating from Britain","To set up the three branches of government","To end slavery","To list the rights in the Bill of Rights"], why:"The Declaration announced independence and gave the reasons. The Constitution (1787) set up the branches of government."},
      {q:"The New Deal was a response to which event?", o:["The Great Depression","World War I","The Civil War","The Cold War"], why:"FDR's New Deal programs were created in the 1930s to fight unemployment and poverty during the Great Depression."},
      {q:"What did the Supreme Court decide in Brown v. Board of Education (1954)?", o:["Segregated public schools are unconstitutional.","Women have the right to vote.","The President can veto laws.","States can leave the Union."], why:"Brown v. Board ruled that separating students by race in public schools violates the Constitution."}
    ]},
  { id:"ss3", title:"Economics", sum:"Supply, demand and how money works.",
    lesson:[
      {h:"Supply and demand", html:`<p>When demand rises and supply stays the same, prices go up. When supply rises and demand stays the same, prices go down.</p>`},
      {h:"Scarcity and opportunity cost", html:`<p>Resources are limited, so we have to choose. The <b>opportunity cost</b> is the value of the next-best option you gave up.</p>`},
      {h:"Inflation and GDP", html:`<p><b>Inflation</b> is a general rise in prices, so each dollar buys less. <b>GDP</b> (gross domestic product) is the total value of goods and services a country produces.</p>`},
      {h:"Government and the economy", html:`<ul><li><b>Fiscal policy:</b> Congress and the President use taxes and spending</li><li><b>Monetary policy:</b> the Federal Reserve manages interest rates and the money supply</li></ul>`},
      {h:"Competition", html:`<p>A <b>monopoly</b> is one company controlling a market. Competition among many sellers usually means lower prices and more choices.</p>`},
      {h:"Credit and interest", html:`<p>When you borrow money, you pay <b>interest</b>. Simple interest: <b>I = p × r × t</b> (principal × rate × time in years).</p><div class="ex">$500 borrowed at 4% for 3 years<br>500 × 0.04 × 3 = <b>$60</b> in interest</div>`}
    ],
    tip:"Many economics questions come with a graph. Read the axes first, then the trend.",
    quiz:[
      {q:"Demand for a game console rises, but the supply stays the same. What usually happens to the price?", o:["It rises","It falls","It stays the same","It drops to zero"], why:"More people want the same number of consoles, so sellers can charge more."},
      {q:"You pick up an extra shift instead of going to a concert. The concert is your…", o:["Opportunity cost","Profit","Inflation","Supply"], why:"Opportunity cost is the next-best thing you gave up to make your choice."},
      {q:"What does inflation mean?", o:["Prices rise over time, so money buys less","Prices fall over time","The economy is growing quickly","Interest rates are low"], why:"Inflation is a general rise in prices, which shrinks what each dollar can buy."},
      {q:"Which institution controls U.S. monetary policy?", o:["The Federal Reserve","Congress","The Supreme Court","The Department of Labor"], why:"The Federal Reserve sets interest rates and manages the money supply. Congress handles fiscal policy (taxes and spending)."}
    ]},
  { id:"ss4", title:"Geography & Sources", sum:"Maps, migration and reading documents.",
    lesson:[
      {h:"Map skills", html:`<p>Use the <b>legend</b> (key) to read symbols, the <b>scale</b> for distance and the <b>compass rose</b> for direction.</p><div class="ex"><b>Latitude</b> lines measure distance north or south of the Equator<br><b>Longitude</b> lines measure distance east or west of the Prime Meridian</div>`},
      {h:"People and places", html:`<p>People move because of <b>push factors</b> (war, no jobs, disaster) and <b>pull factors</b> (jobs, safety, family). Climate and resources shape where people live and work.</p>`},
      {h:"Primary and secondary sources", html:`<p>A <b>primary source</b> was created at the time by someone involved: a letter, diary, photo or speech. A <b>secondary source</b> explains events later: a textbook or a documentary.</p>`},
      {h:"Point of view and bias", html:`<p>Ask who made a source, when and why. A political cartoon or speech is trying to persuade you, so look for its message and what it exaggerates.</p>`}
    ],
    tip:"When a question shows a map or chart, the answer is almost always in it. Trust what you see over what you remember.",
    quiz:[
      {q:"Which of these is a primary source?", o:["A letter written by a Civil War soldier","A history textbook chapter","An encyclopedia article","A documentary made in 2010"], why:"The soldier wrote the letter during the event. The others were made later by people explaining it."},
      {q:"Lines of latitude measure distance…", o:["North or south of the Equator","East or west of the Prime Meridian","Above sea level","Between two cities"], why:"Latitude lines run east-west around the globe and tell you how far north or south a place is."},
      {q:"A family moves because there are no jobs in their hometown. The lack of jobs is a…", o:["Push factor","Pull factor","Natural resource","Trade barrier"], why:"Push factors drive people away from a place. Pull factors (like jobs elsewhere) draw them toward a new one."}
    ]}
  ]}
