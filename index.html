/* ================= CALCULATOR ================= */
let cx = "";
function calcEval(src){
  const t = src.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/π/g, "p").replace(/√/g, "r");
  let i = 0;
  function num(){ const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/.exec(t.slice(i)); if (!m) throw new Error("num"); i += m[0].length; return parseFloat(m[0]); }
  function primary(){
    const c = t[i];
    if (c === "("){ i++; const v = expr(); if (t[i] === ")") i++; return v; }
    if (c === "p"){ i++; return Math.PI; }
    if (c === "r"){ i++; const v = unary(); if (v < 0) throw new Error("sqrt"); return Math.sqrt(v); }
    if (c !== undefined && /[0-9.]/.test(c)) return num();
    throw new Error("syntax");
  }
  function postfix(){ let v = primary(); while (t[i] === "²"){ v = v * v; i++; } return v; }
  function power(){ const b = postfix(); if (t[i] === "^"){ i++; return Math.pow(b, unary()); } return b; }
  function unary(){ if (t[i] === "-"){ i++; return -unary(); } if (t[i] === "+"){ i++; return unary(); } return power(); }
  function term(){
    let v = unary();
    for (;;){
      const c = t[i];
      if (c === "*"){ i++; v *= unary(); }
      else if (c === "/"){ i++; const d = unary(); if (d === 0) throw new Error("div0"); v /= d; }
      else if (c !== undefined && /[0-9(pr]/.test(c)){ v *= unary(); }
      else break;
    }
    return v;
  }
  function expr(){ let v = term(); while (t[i] === "+" || t[i] === "-"){ const c = t[i++]; const w = term(); v = c === "+" ? v + w : v - w; } return v; }
  const v = expr();
  if (i < t.length || !isFinite(v)) throw new Error("syntax");
  return v;
}
function fmtNum(v){
  let s = Math.abs(v) >= 1e12 || (v !== 0 && Math.abs(v) < 1e-6) ? v.toExponential(6) : String(Number(v.toPrecision(10)));
  if (s === "-0") s = "0";
  return s.replace(/-/g, "−");
}
function drawCalc(err){
  calcEl.innerHTML = `<div class="sheet calcsheet" role="dialog" aria-modal="true" aria-label="Calculator">
    <div class="shd"><h2>Calculator</h2><button class="iconbtn" data-act="calcclose" aria-label="Close calculator">${I.close}</button></div>
    <div class="cdisp" tabindex="0" role="group" aria-label="Calculator display"><div id="cexpr">${cx || "0"}</div><div id="cres" class="${err ? "err" : ""}">${err ? "Check your entry" : ""}</div></div>
    <div class="keys">${["C", "(", ")", "⌫", "x²", "√", "^", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", ".", "π", "="].map(k =>
      `<button class="key${"÷×−+^".includes(k) ? " op" : ""}${k === "=" ? " eq" : ""}${["C", "⌫", "(", ")", "x²", "√", "π"].includes(k) ? " fn" : ""}" data-k="${k}" aria-label="${{"⌫":"Delete", "C":"Clear", "x²":"x squared", "√":"Square root", "^":"Power"}[k] || k}">${k}</button>`).join("")}</div>
    <p class="small muted center">Tip: √ and x² work on the number or parentheses next to them.</p>
  </div>`;
  preview();
}
function preview(){
  const e = document.getElementById("cexpr"), r = document.getElementById("cres");
  if (!e || !r) return;
  e.textContent = cx || "0";
  if (!r.classList.contains("err")){
    let out = "";
    if (cx){ try { const val = fmtNum(calcEval(cx)); if (val !== cx) out = "= " + val; } catch (err) { out = ""; } }
    r.textContent = out;
  }
  e.parentNode.scrollTop = e.parentNode.scrollHeight;   // a long sum shows its newest part; scroll up inside the display for the start
}
function press(k){
  const r = document.getElementById("cres"); if (r) r.classList.remove("err");
  if (k === "C") cx = "";
  else if (k === "⌫") cx = Array.from(cx).slice(0, -1).join("");
  else if (k === "=") { if (!cx) return; try { cx = fmtNum(calcEval(cx)); } catch (e) { drawCalc(true); return; } }
  else if (k === "x²") cx += "²";
  else if (k === "√") cx += "√(";
  else cx += k;
  preview();
}
function openCalc(){ calcEl.hidden = false; drawCalc(false); }

/* ================= render + events ================= */
const VIEWS = {home:vHome, subject:vSubject, lesson:vLesson, quiz:vQuiz, results:vResults, practice:vPractice, testintro:vTestIntro, test:vTest, tres:vTestResult,
  tools:vTools, about:vAbout, decks:vDecks, cards:vCards, formulas:vFormulas, essays:vEssays, essay:vEssay, tips:vTips, me:vMe};
function render(scrollTop){
  const v = cur(), full = FULL.has(v.v);
  app.innerHTML = VIEWS[v.v](v) + (full ? "" : tabbar());
  document.body.classList.toggle("tabbed", !full);
  if (scrollTop){ stopSpeak(); window.scrollTo(0, 0); const sc = app.querySelector(".screen"); if (sc) sc.classList.add("enter"); }
  if (v.v === "essay" && v.pane === "write"){ const ta = document.getElementById("essay-text"); if (ta) ta.value = essayState(v.id).text; }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act], [data-k]");
  if (!t) return;
  if (t.dataset.k){ press(t.dataset.k); return; }
  if (t.dataset.scrim && e.target !== t) return;
  const a = t.dataset.act, id = t.dataset.id, v = cur(), A = P.active;
  switch (a){
    case "tab": pauseEssay(); if (tab === id) stacks[tab] = [{v:ROOT[tab]}]; tab = id; render(true); break;
    case "back": pauseEssay(); back(); break;
    case "open": go({v:id}); break;
    case "subject": go({v:"subject", id}); break;
    case "lesson": case "nextlesson": openLesson(id); break;
    case "start": go(makeQuiz("lesson", findUnit(id).s.id, id)); break;
    case "mix": go(makeQuiz("mix", id)); break;
    case "allmix": go(makeQuiz("all")); break;
    case "missed": if (missedIds().length) go(makeQuiz("miss")); break;
    case "pick": {
      if (v.picked !== null) break;
      const k = +t.dataset.i, q = v.qs[v.i], ok = q.opts[k].ok;
      v.picked = k;
      if (ok) v.score++; else v.wrongs.push({q:q.q, a:q.opts.find(o => o.ok).t, why:q.why});
      record(q, ok); save(); render(false);
      const nb = document.getElementById("fbnext");
      if (nb) nb.scrollIntoView({behavior: reduceMotion() ? "auto" : "smooth", block:"end"});
      break;
    }
    case "next": {
      if (v.i < v.qs.length - 1){ v.i++; v.picked = null; render(true); break; }
      const n = v.qs.length;
      if (v.mode === "lesson"){ const r = P.u[v.uid] || {}; r.done = true; r.best = Math.max(r.best || 0, v.score); r.of = n; P.u[v.uid] = r; }
      else if (v.mode === "mix"){ const r = P.mix[v.sid] || {}; r.best = Math.max(r.best || 0, v.score); r.of = n; P.mix[v.sid] = r; }
      save();
      replace({v:"results", mode:v.mode, sid:v.sid, uid:v.uid, title:v.title, score:v.score, n, wrongs:v.wrongs});
      break;
    }
    case "retry": replace(makeQuiz(v.mode, v.sid, v.uid)); break;
    case "tosubject": stacks[tab] = [{v:ROOT[tab]}, {v:"subject", id}]; render(true); break;
    case "toroot": stacks[tab] = [{v:ROOT[tab]}]; render(true); break;
    case "testintro": go({v:"testintro", id}); break;
    case "settimed": v.timed = id === "1"; render(false); break;
    case "starttest": startTest(id, v.timed !== false); break;
    case "resume": resumeTest(); break;
    case "tpick": if (A){ A.ans[A.i] = +t.dataset.i; save(); render(false); } break;
    case "tflag": if (A){ A.flag[A.i] = !A.flag[A.i]; save(); render(false); } break;
    case "tprev": if (A && A.i > 0){ A.i--; render(true); } break;
    case "tnext": if (A && A.i < TESTS[A.sid].qs.length - 1){ A.i++; save(); render(true); } break;
    case "tnav": v.sheet = "nav"; render(false); break;
    case "tjump": if (A){ A.i = +t.dataset.i; v.sheet = null; render(true); } break;
    case "tsheetclose": v.sheet = null; if (A && !A.run){ A.run = true; A.lt = Date.now(); } render(false); break;
    case "tpause": if (A){ commit(); A.run = false; save(); render(false); } break;
    case "tresume": if (A){ A.run = true; A.lt = Date.now(); render(false); } break;
    case "texit": if (A){ commit(); A.run = false; save(); } v.sheet = "exit"; render(false); break;
    case "texitgo": if (A){ commit(); A.run = false; save(); } tab = "practice"; stacks.practice = [{v:"practice"}]; render(true); break;
    case "tsubmitask": v.sheet = "submit"; render(false); break;
    case "tsubmit": submitTest(false); break;
    case "rfilter": v.filter = id; render(false); break;
    case "tres": go({v:"tres", sid:id, k:+t.dataset.n, filter:"miss"}); break;
    case "deck": startDeck(id); break;
    case "deckagain": stacks[tab].pop(); startDeck(id); break;
    case "cflip": v.flip = !v.flip; render(false); break;
    case "cgot": case "cagain": {
      const known = P.cards[v.sid] || (P.cards[v.sid] = {}), idx = v.queue[v.i];
      if (a === "cgot"){ known[idx] = 1; v.got++; } else delete known[idx];
      v.i++; v.flip = false; save(); render(false);
      break;
    }
    case "essay": go({v:"essay", id, pane:"read"}); break;
    case "epane": v.pane = id; v.ask = false; render(true); break;
    case "etimer": {
      const st = essayState(v.id);
      if (essayRun && essayRun.id === v.id) pauseEssay();
      else if (ELIMIT - st.used <= 0){ st.used = 0; save(); }
      else { pauseEssay(); essayRun = {id:v.id, lt:Date.now()}; }
      render(false);
      break;
    }
    case "eoutline": { const st = essayState(v.id); st.text = st.text.trim() ? st.text.replace(/\s+$/, "") + "\n\n" + OUTLINE : OUTLINE; save(); render(false); break; }
    case "eclear": v.ask = true; render(false); break;
    case "eclearyes": essayState(v.id).text = ""; v.ask = false; save(); render(false); break;
    case "eclearno": v.ask = false; render(false); break;
    case "welcomed": P.seen = true; save(); render(false); break;
    case "bknow": markBackedUp(); save(); tab = "me"; stacks.me = [{v:"me", bk:"export"}]; render(true); { const c = document.getElementById("bkcode"); if (c) c.scrollIntoView({block:"center"}); } break;
    case "bklater": P.bk.snooze = dayPlus(backupNeed().level === "overdue" ? 1 : 3); save(); render(false); break;
    case "install": promptInstall(); break;
    case "installhow": showKeepSafe(); break;
    case "installdone": installDone(); render(false); break;
    case "quick5": go(makeQuiz("quick")); break;
    case "listen": if (speaking) stopSpeak(); else speak(readText(v)); syncListen(); break;
    case "cleardate": delete P.set.date; save(); render(false); break;
    case "bkexport": markBackedUp(); save(); v.bk = "export"; v.bkok = false; render(false); break;
    case "bkimport": v.bk = "import"; v.bkok = false; render(false); break;
    case "bkclose": v.bk = null; render(false); break;
    case "bkcopy": {
      const ta = document.getElementById("bkcode"), msg = document.getElementById("bkmsg");
      const fallback = () => { ta.focus(); ta.select(); msg.textContent = "Your code is selected. Tap Copy in the menu to copy it."; };
      try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "Copied! Paste it somewhere safe."; msg.className = "small okmsg"; }, fallback); } catch (err) { fallback(); }
      break;
    }
    case "bkrestore": {
      const ta = document.getElementById("bkin");
      if (!ta.value.trim()){ setBkMsg("Choose a backup file or paste a code first.", "errmsg"); break; }
      let d;
      try { d = parseCode(ta.value); } catch (err) { setBkMsg("That code didn't work. Make sure you copied the whole thing, starting with SC1.", "errmsg"); break; }
      if (needsConfirm() && !armed(t, "Tap again to replace your progress")) break;
      applyRestored(d, true);
      stacks.learn = [{v:"home"}]; stacks.practice = [{v:"practice"}]; stacks.tools = [{v:"tools"}]; stacks.me = [{v:"me", bkok:true}]; render(true);
      break;
    }
    case "bkfile": saveBackupFile(); break;
    case "copyrestore": {
      if (needsConfirm() && !armed(t, "Tap again to bring back this copy")) break;
      let c;
      try { c = restoreCopy(+id); } catch (err) { const m = document.getElementById("copymsg"); if (m){ m.textContent = "That copy couldn't be read."; m.className = "small errmsg"; } break; }
      stacks.learn = [{v:"home"}]; stacks.practice = [{v:"practice"}]; stacks.tools = [{v:"tools"}]; stacks.me = [{v:"me", bkok:"Copy from " + fmtDate(fromDayKey(c.day)) + " restored."}]; render(true);
      break;
    }
    case "copiesdelete": if (!armed(t, "Tap again to delete the copies")) break; try { localStorage.removeItem(COPIES_KEY); } catch (err) {} render(false); break;
    case "damagedrestore": tab = "me"; stacks.me = [{v:"me", bk:"import"}]; render(true); { const c = document.getElementById("copies") || document.getElementById("bkin"); if (c) c.scrollIntoView({block:"start"}); } break;
    case "damagedfresh": damaged = false; holdSave = false; save(); render(false); break;
    case "report": v.rep = id; render(false); break;
    case "reportclose": v.rep = null; render(false); break;
    case "copyemail": {
      const msg = document.getElementById("fbmsg"), el = document.getElementById("fbemail");
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = "The address is selected. Tap Copy in the menu to copy it."; };
      try { navigator.clipboard.writeText(FEEDBACK_EMAIL).then(() => { msg.textContent = "Email address copied."; msg.className = "small okmsg"; }, fallback); } catch (err) { fallback(); }
      break;
    }
    case "calc": openCalc(); break;
    case "calcclose": calcEl.hidden = true; break;
    case "fs": P.set.fs = id; applyFS(); save(); render(false); break;
    case "reset": v.ask = true; render(false); break;
    case "resetno": v.ask = false; render(false); break;
    case "resetyes": { essayRun = null; const fs = P.set.fs; P = fresh(); P.set.fs = fs; damaged = false; holdSave = false; save(); v.ask = false;
      stacks.learn = [{v:"home"}]; stacks.practice = [{v:"practice"}]; stacks.tools = [{v:"tools"}]; render(false); break; }
  }
});

let saveTimer = null;
document.addEventListener("input", e => {
  if (e.target.id === "bkin"){ disarm(document.querySelector('[data-act="bkrestore"]')); return; }
  if (e.target.id !== "essay-text") return;
  const st = essayState(cur().id); st.text = e.target.value;
  const w = document.getElementById("wc"); if (w) w.textContent = wc(st.text) + " words";
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 500);
});
document.addEventListener("change", e => {
  if (e.target.id === "bkfile"){ readBackupFile(e.target); return; }
  if (e.target.id === "tdate"){ if (e.target.value) P.set.date = e.target.value; else delete P.set.date; save(); render(false); return; }
  const k = e.target.dataset && e.target.dataset.check;
  if (!k) return;
  const st = essayState(cur().id);
  if (e.target.checked) st.checks[k] = 1; else delete st.checks[k];
  save();
  const c = document.getElementById("ckcount");
  if (c) c.textContent = Object.keys(st.checks).length + " of " + CHECKS.reduce((a, g) => a + g.items.length, 0) + " checked";
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!calcEl.hidden){
    const map = {"*":"×", "x":"×", "/":"÷", "-":"−", "+":"+", "^":"^", "(":"(", ")":")", ".":".", "Enter":"=", "=":"=", "Backspace":"⌫", "c":"C", "C":"C", "p":"π"};
    if (e.key === "Escape"){ calcEl.hidden = true; return; }
    const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (k){ e.preventDefault(); press(k); }
    return;
  }
  if (e.target.matches && e.target.matches("input, textarea, select")) return;
  const v = cur(), key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const idx = "abcd".indexOf(key) > -1 && key.length === 1 ? "abcd".indexOf(key) : ("1234".indexOf(key) > -1 && key.length === 1 ? "1234".indexOf(key) : -1);
  const tap = sel => { const el = document.querySelector(sel); if (el && !el.disabled){ e.preventDefault(); el.click(); } };
  if (v.rep) return;
  if (v.v === "quiz"){
    if (idx > -1 && v.picked === null) tap(`[data-act="pick"][data-i="${idx}"]`);
    else if (key === "Enter" && v.picked !== null) tap("#fbnext");
  } else if (v.v === "test" && !v.sheet && P.active && P.active.run){
    if (idx > -1) tap(`[data-act="tpick"][data-i="${idx}"]`);
    else if (key === "ArrowRight") tap('[data-act="tnext"]');
    else if (key === "ArrowLeft") tap('[data-act="tprev"]');
    else if (key === "f") tap('[data-act="tflag"]');
  } else if (v.v === "cards"){
    if (key === " " || key === "Enter") tap('[data-act="cflip"]');
    else if (v.flip && key === "ArrowRight") tap('[data-act="cgot"]');
    else if (v.flip && key === "ArrowLeft") tap('[data-act="cagain"]');
  }
});

let tickN = 0;
setInterval(() => {
  tickN++;
  const A = P.active;
  if (A && A.run){
    commit();
    if (A.limit && A.used >= A.limit){ submitTest(true); return; }
    const el = document.getElementById("timer");
    if (el){ el.textContent = A.limit ? fmtTime(A.limit - A.used) : fmtTime(A.used); if (A.limit && A.limit - A.used < 300000) el.parentNode.classList.add("low"); }
    if (tickN % 5 === 0) save();
  }
  if (essayRun){
    const st = essayState(essayRun.id), now = Date.now();
    st.used += now - essayRun.lt; essayRun.lt = now;
    const el = document.getElementById("etimer");
    if (st.used >= ELIMIT){
      st.used = ELIMIT; essayRun = null; save();
      if (cur().v === "essay") render(false);
    } else if (el) el.textContent = fmtTime(ELIMIT - st.used);
    if (tickN % 10 === 0) save();
  }
}, 1000);

function pauseAll(){
  const A = P.active;
  if (A && A.run){ commit(); A.run = false; if (cur().v === "test") render(false); }
  pauseEssay(); save();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseAll(); });
window.addEventListener("pagehide", pauseAll);
// Two tabs: the newest save wins everywhere, so an older tab can't save over newer progress (same as Till Payday)
window.addEventListener("storage", e => {
  if (e.key !== KEY && e.key !== null) return;
  if (e.newValue == null){ essayRun = null; P = fresh(); render(false); return; }   // cleared in another tab
  if (e.newValue === JSON.stringify(P)) return;
  try { const d = JSON.parse(e.newValue); if (d && typeof d === "object"){ essayRun = null; P = hydrate(d); damaged = false; applyFS(); render(false); } } catch (err) {}
});

if (loadedRaw) keepDailyCopy(loadedRaw);
applyFS();
render(false);
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.self === window.top) navigator.serviceWorker.register("sw.js").catch(() => {});
} catch (e) {}

</script>
