<script>
"use strict";
/* Full practice tests. In every question the FIRST option is the correct one; the app shuffles them.
   t = the lesson (topic) the question belongs to, used for the score breakdown. */
const PASS = {
  repair:`In a church basement on Saturday mornings, a line forms by the door. People carry broken toasters, torn jackets and lamps that flicker. They are waiting for the volunteers of the neighborhood repair café, where fixing things is free.<br><br>The idea began in the Netherlands in 2009 and has since spread to thousands of communities. Organizers say the cafés keep usable goods out of landfills, but the benefits go beyond the trash bin. Visitors sit beside the volunteers, watch each repair and often learn to do it on their own next time. "People come in for a lamp," one volunteer explained, "and leave knowing how a lamp works."`,
  letter:`<b>To the Editor:</b> The city's plan to remove 40 parking spaces on Main Street for a bike lane will ruin local businesses. My bakery depends on customers who drive. Last week, three of my regulars told me they would shop somewhere else if the parking disappears. Everyone knows that people won't walk more than a block to buy bread. The council should reject this plan before Main Street becomes a ghost town.<br><i>— R. Delgado, owner of Sunrise Bakery</i>`,
  bus:`The bus was late again. Lani pulled her hood tighter and watched the rain blur the streetlights. Her phone buzzed: her uncle, asking if she'd made it to the interview yet. She typed <i>not yet</i>, then deleted it.<br><br>Instead, she started walking. Twenty blocks wasn't nothing, but neither was this chance. By the time the glass doors of the office came into view, her shoes were soaked and her heart was pounding. She checked the time. Four minutes early.`,
  sleep:`Researchers have long known that sleep helps the brain store new information. In a common type of study, volunteers learn a list of words, then either sleep or stay awake for several hours before being tested. Those who sleep usually remember more.<br><br>Scientists think that during deep sleep, the brain replays the day's experiences and moves important memories into long-term storage. The lesson for students is simple: an all-night cram session may backfire. A few hours of review followed by a full night's rest often works better.`
};

const TESTS = {
math:{ mins:60, qs:[
  {t:"m1", q:"A worker earns $18.50 an hour. How much does she earn for 32 hours of work?", o:["$592.00","$576.00","$600.00","$518.00"], why:"18.50 × 32 = 592. Multiply the hourly rate by the hours."},
  {t:"m1", q:"Which of these numbers is the greatest?", o:["5/8","62%","0.6","3/5"], why:"Convert everything to decimals: 5/8 = 0.625, 62% = 0.62, 0.6, and 3/5 = 0.6. The biggest is 0.625, which is 5/8."},
  {t:"m1", q:"A restaurant bill is $48. You leave a 15% tip. What is the total you pay?", o:["$55.20","$7.20","$63.00","$50.40"], why:"15% of $48 is 0.15 × 48 = $7.20. Add it to the bill: $48 + $7.20 = $55.20. ($7.20 is just the tip.)"},
  {t:"m1", q:"Rent goes up from $1,200 to $1,350 a month. What is the percent increase?", o:["12.5%","11.1%","15%","150%"], why:"The increase is $150. Divide by the original amount: 150 ÷ 1,200 = 0.125 = 12.5%. (Dividing by the new amount, 1,350, gives the wrong answer of 11.1%.)"},
  {t:"m1", q:"−8 + 3 × (−2) = ?", o:["−14","10","−2","−22"], why:"Multiply first: 3 × (−2) = −6. Then −8 + (−6) = −14."},
  {t:"m3", q:"2³ + √49 = ?", o:["15","13","57","10"], why:"2³ = 2 × 2 × 2 = 8 and √49 = 7. So 8 + 7 = 15. (13 comes from mistaking 2³ for 2 × 3.)"},
  {t:"m2", q:"On a map, 1 inch represents 40 miles. Two towns are 2.5 inches apart on the map. How far apart are they in real life?", o:["100 miles","16 miles","42.5 miles","160 miles"], why:"Multiply: 2.5 × 40 = 100 miles."},
  {t:"m6", p:`<b>Cars washed this week</b><br>Mon 12 · Tue 18 · Wed 9 · Thu 21 · Fri 15`, q:"What is the range of the number of cars washed?", o:["12","15","21","75"], why:"Range = highest − lowest = 21 − 9 = 12. (15 is the median and 75 is the total.)"},
  {t:"m2", q:"An animal shelter has only cats and dogs, in a ratio of 3 cats to 5 dogs. There are 40 animals in all. How many are cats?", o:["15","24","25","8"], why:"3 + 5 = 8 parts in total. Cats are 3/8 of the animals: 3/8 × 40 = 15."},
  {t:"m3", q:"Solve for x: 5(x − 2) = 3x + 6", o:["x = 8","x = 2","x = 4","x = −8"], why:"Distribute: 5x − 10 = 3x + 6. Subtract 3x: 2x − 10 = 6. Add 10: 2x = 16. Divide: x = 8."},
  {t:"m3", q:"Which expression is equal to 3(2x − 4)?", o:["6x − 12","6x − 4","5x − 12","6x + 12"], why:"Multiply the 3 by both terms inside: 3 × 2x = 6x and 3 × (−4) = −12."},
  {t:"m3", q:"A phone plan costs $40 a month plus $0.10 per text. Kai's bill was $52. How many texts did he send?", o:["120","12","520","1,200"], why:"Subtract the base fee: $52 − $40 = $12 spent on texts. Divide by the price per text: 12 ÷ 0.10 = 120."},
  {t:"m3", q:"Which is the factored form of x² + 5x + 6?", o:["(x + 2)(x + 3)","(x + 1)(x + 6)","(x + 5)(x + 1)","(x − 2)(x − 3)"], why:"You need two numbers that multiply to 6 and add to 5: 2 and 3. So x² + 5x + 6 = (x + 2)(x + 3)."},
  {t:"m3", q:"What are the solutions to x² = 81?", o:["x = 9 or x = −9","x = 9 only","x = 40.5","x = −9 only"], why:"Both 9 × 9 and (−9) × (−9) equal 81, so there are two solutions."},
  {t:"m3", q:"Which is the solution to 4x − 3 ≤ 13?", o:["x ≤ 4","x ≥ 4","x ≤ 2.5","x ≥ −4"], why:"Add 3 to both sides: 4x ≤ 16. Divide by 4 (a positive number, so the sign stays the same): x ≤ 4."},
  {t:"m4", q:"What is the slope of any line parallel to y = 4x − 7?", o:["4","−4","−1/4","−7"], why:"Parallel lines have the same slope. The slope of y = 4x − 7 is 4. (−1/4 would be the slope of a perpendicular line.)"},
  {t:"m4", q:"A line crosses the y-axis at (0, 3) and has a slope of −2. What is its equation?", o:["y = −2x + 3","y = 3x − 2","y = 2x + 3","y = −2x − 3"], why:"In y = mx + b, m is the slope (−2) and b is the y-intercept (3): y = −2x + 3."},
  {t:"m4", q:"If f(x) = 2x² − 3, what is f(−2)?", o:["5","−11","11","−5"], why:"Plug in −2: (−2)² = 4, then 2 × 4 = 8, and 8 − 3 = 5."},
  {t:"m4", p:`<b>x:</b> 1, 2, 3, 4<br><b>y:</b> 5, 8, 11, 14`, q:"Which equation matches every pair in the table?", o:["y = 3x + 2","y = x + 4","y = 5x","y = 2x + 3"], why:"y goes up by 3 each time x goes up by 1, so the slope is 3. Check x = 1: 3(1) + 2 = 5. ✓ (y = 2x + 3 works for x = 1 but gives 7, not 8, for x = 2.)"},
  {t:"m5", q:"A rectangular garden is 15 feet long and 8 feet wide. How much fencing is needed to go all the way around it?", o:["46 feet","120 feet","23 feet","38 feet"], why:"Perimeter = 15 + 8 + 15 + 8 = 46 feet. (120 is the area.)"},
  {t:"m5", q:"A cylinder-shaped tank has a radius of 2 meters and a height of 5 meters. What is its volume? (Use π ≈ 3.14)", o:["62.8 cubic meters","31.4 cubic meters","125.6 cubic meters","20 cubic meters"], why:"V = πr²h = 3.14 × 2² × 5 = 3.14 × 4 × 5 = 62.8 cubic meters."},
  {t:"m5", q:"A 13-foot ladder leans against a wall. Its base is 5 feet from the wall. How high up the wall does the ladder reach?", o:["12 feet","8 feet","18 feet","13.9 feet"], why:"The ladder is the hypotenuse: 5² + h² = 13², so 25 + h² = 169, h² = 144 and h = 12 feet."},
  {t:"m5", q:"A circle has a diameter of 10 inches. What is its circumference? (Use π ≈ 3.14)", o:["31.4 inches","15.7 inches","78.5 inches","314 inches"], why:"Circumference = π × diameter = 3.14 × 10 = 31.4 inches. (78.5 is the area.)"},
  {t:"m6", q:"You flip two coins. What is the probability that both land on tails?", o:["1/4","1/2","1/3","3/4"], why:"The flips don't affect each other, so multiply: 1/2 × 1/2 = 1/4."},
  {t:"m6", q:"Over five weeks, Leilani worked 32, 40, 36, 40 and 27 hours. What was her mean (average) number of hours per week?", o:["35","36","40","13"], why:"Add the hours: 32 + 40 + 36 + 40 + 27 = 175. Divide by 5 weeks: 175 ÷ 5 = 35. (36 is the median, 40 is the mode and 13 is the range.)"}
]},
rla:{ mins:50, qs:[
  {t:"r1", p:PASS.repair, q:"Which statement best expresses the main idea of the passage?", o:["Repair cafés help communities by fixing items for free and teaching people new skills.","Repair cafés began in the Netherlands in 2009.","Most broken toasters can't be fixed.","Church basements are good places for volunteers to meet."], why:"The passage describes the cafés, their spread and their benefits (less waste and new skills). The 2009 date is only a supporting detail."},
  {t:"r1", p:PASS.repair, q:"Which detail shows that the idea has grown over time?", o:["It has since spread to thousands of communities.","A line forms by the door.","People carry broken toasters.","Fixing things is free."], why:"Going from one country in 2009 to thousands of communities shows growth."},
  {t:"r2", p:PASS.repair, q:"Why does the author include the volunteer's quote at the end?", o:["To show that visitors gain knowledge, not just a fixed item","To explain how to repair a lamp","To argue that repair cafés should charge money","To show that the volunteers are tired"], why:"The quote sums up the bigger benefit: people leave understanding how things work."},
  {t:"r2", p:PASS.repair, q:"The author's attitude toward repair cafés is best described as…", o:["approving","critical","confused","fearful"], why:"The author highlights benefits that \"go beyond the trash bin\" and ends on a positive quote. The tone is favorable."},
  {t:"r3", p:PASS.letter, q:"What is the writer's main claim?", o:["The city council should reject the bike-lane plan.","Bike lanes make streets safer.","Sunrise Bakery sells the best bread in town.","Main Street needs more businesses."], why:"The last sentence states the claim directly: the council should reject the plan."},
  {t:"r3", p:PASS.letter, q:"Which sentence is an unsupported generalization?", o:["Everyone knows that people won't walk more than a block to buy bread.","My bakery depends on customers who drive.","The plan will remove 40 parking spaces.","Three of my regulars told me they would shop somewhere else."], why:"\"Everyone knows\" makes a sweeping claim with no evidence behind it."},
  {t:"r3", p:PASS.letter, q:"Which evidence would most strengthen the writer's argument?", o:["A survey showing most Main Street shoppers arrive by car","A photo of the bakery's best-selling bread","A story about the writer's first day in business","A list of bike shops in the city"], why:"A survey of real shoppers is specific, relevant evidence. Right now, the letter relies on three customers and a generalization."},
  {t:"r2", p:PASS.letter, q:"Why does the writer say Main Street could become \"a ghost town\"?", o:["To exaggerate the possible harm and stir up emotion","To describe Main Street's history","To show that the street is already empty","To suggest the city build a museum"], why:"\"Ghost town\" is an exaggeration meant to make readers feel alarmed. It's an emotional appeal, not evidence."},
  {t:"r2", p:PASS.bus, q:"What does the sentence \"Twenty blocks wasn't nothing, but neither was this chance\" suggest?", o:["Lani decides the opportunity is worth a hard walk.","Lani thinks the interview isn't important.","Lani is unsure where the office is.","Lani wants to go home."], why:"She admits the walk is tough but compares it to how much the chance matters, then walks."},
  {t:"r2", p:PASS.bus, q:"Which word best describes Lani in this passage?", o:["determined","careless","lazy","angry"], why:"She walks twenty blocks in the rain instead of giving up and still arrives early. That's determination."},
  {t:"r1", p:PASS.bus, q:"What does Lani do instead of waiting for the bus?", o:["She walks to the interview.","She calls her uncle for a ride.","She goes back home.","She asks a stranger for directions."], why:"\"Instead, she started walking.\" She walks the twenty blocks."},
  {t:"r1", p:PASS.sleep, q:"What is the main idea of this passage?", o:["Sleep helps the brain lock in what you've learned.","Volunteers in studies learn lists of words.","Scientists don't understand sleep.","Students should study all night before a test."], why:"Every part of the passage, from the studies to the advice, supports the idea that sleep helps memory."},
  {t:"r1", p:PASS.sleep, q:"Which detail explains HOW sleep may help memory?", o:["The brain replays the day's experiences and moves memories into long-term storage.","Volunteers learn a list of words.","Those who sleep usually remember more.","An all-night cram session may backfire."], why:"This is the only sentence that describes what happens in the brain, the \"how.\" The others describe results or advice."},
  {t:"r2", p:PASS.sleep, q:"What is the purpose of the last two sentences?", o:["To give students practical advice based on the research","To introduce a new study","To argue that sleep research is wrong","To describe the volunteers"], why:"They turn the research into a takeaway for students: review, then rest."},
  {t:"r4", q:"Either the cooks or the server ___ responsible for closing tonight.", o:["is","are","were","have been"], why:"With either/or, the verb matches the closest subject. \"Server\" is singular, so use \"is.\""},
  {t:"r4", q:"Which sentence is punctuated correctly?", o:["After the meeting ended, we went to lunch.","After the meeting ended we, went to lunch.","After, the meeting ended we went to lunch.","After the meeting, ended we went to lunch."], why:"Put the comma after the opening clause \"After the meeting ended,\" before the main sentence begins."},
  {t:"r4", q:"Which of these is a sentence fragment?", o:["Because the store closed early.","The store closed early.","We left because the store closed early.","The store closed early, so we left."], why:"\"Because the store closed early\" leaves you hanging. It needs a main clause to be a complete sentence."},
  {t:"r4", q:"The new schedule will ___ every employee on the night shift.", o:["affect","effect","effects","affection"], why:"\"Affect\" is the verb meaning \"to influence.\" \"Effect\" is usually a noun meaning \"a result.\""},
  {t:"r4", q:"\"___ going to need ___ ID at the front desk.\" Which pair fills the blanks correctly?", o:["You're / your","Your / you're","Your / your","You're / you're"], why:"\"You're\" means \"you are\" (you are going to need). \"Your\" shows ownership (your ID)."},
  {t:"r4", q:"The supervisor thanked Keoni and ___ for staying late.", o:["me","I","myself","mine"], why:"The pronoun receives the action (thanked), so use the object form \"me.\" Drop Keoni to check: \"thanked me.\""},
  {t:"r4", q:"The job requires typing quickly, answering phones and ___.", o:["greeting visitors","to greet visitors","visitors are greeted","greet visitors"], why:"Keep the list parallel: typing, answering, greeting. All three are -ing words."},
  {t:"r4", q:"The store raised its prices. ___, the store stayed busy all month.", o:["Nevertheless","Therefore","For example","Similarly"], why:"You'd expect higher prices to drive people away, but they didn't. \"Nevertheless\" signals that contrast."},
  {t:"r4", q:"Which sentence is written correctly?", o:["While cooking dinner, I heard the smoke alarm.","While cooking dinner, the smoke alarm went off.","The smoke alarm, while cooking dinner, went off.","While cooking dinner, the alarm was heard by me."], why:"The opening phrase must describe the person cooking. Only the first sentence puts \"I\" right after the comma. The others make it sound like the alarm was cooking."},
  {t:"r4", q:"The two ___ uniforms were washed overnight.", o:["nurses'","nurse's","nurses","nurses's"], why:"The uniforms belong to two nurses. For a plural that already ends in s, add only an apostrophe: nurses'."},
  {t:"r4", q:"Which sentence uses capital letters correctly?", o:["We visited Pearl Harbor in December.","We visited pearl harbor in December.","We visited Pearl Harbor in december.","We Visited Pearl Harbor in December."], why:"Names of specific places and months are capitalized. \"Visited\" is an ordinary verb, so it stays lowercase."}
]},
sci:{ mins:55, qs:[
  {t:"s1", q:"Which part of a cell releases energy from food?", o:["Mitochondria","Nucleus","Cell wall","Chloroplast"], why:"Mitochondria carry out cellular respiration, releasing energy from glucose."},
  {t:"s1", q:"Producers in an ecosystem, like grass and trees, get their energy from…", o:["sunlight","eating other plants","decomposers","the soil alone"], why:"Producers use sunlight to make their own food through photosynthesis."},
  {t:"s1", q:"Which body system carries oxygen to the body's cells?", o:["Circulatory system","Digestive system","Nervous system","Skeletal system"], why:"The heart pumps blood, which carries oxygen and nutrients to cells."},
  {t:"s1", q:"A plant is kept in a completely dark closet for two weeks. Which process is most directly affected?", o:["Photosynthesis","Digestion","Evaporation","Erosion"], why:"Photosynthesis needs light. Without it, the plant can't make food."},
  {t:"s1", q:"Tall (T) is dominant over short (t). A TT plant is crossed with a tt plant. What percent of the offspring will be tall?", o:["100%","75%","50%","25%"], why:"Every offspring gets one T and one t, so they're all Tt. With a dominant T, all of them are tall."},
  {t:"s1", q:"In the food chain grass → rabbit → fox, a disease kills most of the rabbits. What is most likely to happen next?", o:["The fox population decreases.","The grass dies out.","The fox population increases.","Nothing changes."], why:"Foxes lose their main food source, so their numbers drop. (With fewer rabbits eating it, the grass would likely grow more, not less.)"},
  {t:"s1", q:"Antibiotics are medicines that work against…", o:["bacteria","viruses","all germs equally","allergies"], why:"Antibiotics kill bacteria or stop them from growing. They don't work on viruses like the common cold or flu."},
  {t:"s2", q:"Which of these is a compound?", o:["Water (H₂O)","Oxygen (O₂)","Gold (Au)","Helium (He)"], why:"A compound contains two or more different elements bonded together. Water has hydrogen and oxygen. The others are each made of a single element."},
  {t:"s2", q:"A rocket pushes hot gas downward, and the rocket moves upward. Which law does this show?", o:["Newton's third law","Newton's first law","The law of supply and demand","The water cycle"], why:"Every action (gas pushed down) has an equal and opposite reaction (rocket pushed up)."},
  {t:"s2", q:"A 1,000 kg car speeds up at 2 m/s². How much force is acting on it?", o:["2,000 N","500 N","1,002 N","20,000 N"], why:"F = m × a = 1,000 × 2 = 2,000 newtons."},
  {t:"s2", q:"The metal handle of a pan on the stove gets hot. How did the heat travel?", o:["Conduction","Convection","Radiation","Evaporation"], why:"Heat moved through the solid metal by direct contact. That's conduction."},
  {t:"s2", q:"A cyclist stops pedaling on a flat road and gradually slows down. What force mainly causes this?", o:["Friction","Gravity pulling forward","Magnetism","Inertia speeding it up"], why:"Friction from the road and the air works against motion and slows the bike."},
  {t:"s2", q:"An object has a mass of 30 g and a volume of 10 cm³. Water's density is 1 g/cm³. What is the object's density, and will it float in water?", o:["3 g/cm³; it sinks","3 g/cm³; it floats","0.33 g/cm³; it floats","300 g/cm³; it sinks"], why:"Density = mass ÷ volume = 30 ÷ 10 = 3 g/cm³. That's denser than water, so it sinks."},
  {t:"s2", q:"What energy change happens in a toaster?", o:["Electrical energy to thermal (heat) energy","Thermal energy to electrical energy","Chemical energy to sound energy","Light energy to chemical energy"], why:"A toaster takes electricity from the outlet and turns it into heat."},
  {t:"s3", q:"Where do most earthquakes happen?", o:["Along the edges of tectonic plates","In the middle of oceans far from any plates","Only in cold climates","Only near large cities"], why:"Earthquakes happen where plates grind past, push into or pull away from each other."},
  {t:"s3", q:"Which statement describes climate rather than weather?", o:["The region usually has warm, dry summers and mild, wet winters.","It is raining right now.","Tomorrow will be windy.","This afternoon it reached 85°F."], why:"Climate is the long-term pattern. The others describe conditions on a single day."},
  {t:"s3", q:"Which type of rock forms when lava cools and hardens?", o:["Igneous","Sedimentary","Metamorphic","Fossil"], why:"Igneous rock forms from cooled magma or lava, like the basalt that makes up much of Hawaiʻi."},
  {t:"s3", q:"What causes the phases of the moon?", o:["We see different amounts of the moon's sunlit half as it orbits Earth.","Earth's shadow covers part of the moon each night.","The moon gives off less light some nights.","Clouds block part of the moon."], why:"Half the moon is always lit by the sun. As it orbits, we see more or less of that lit half. (Earth's shadow only causes eclipses.)"},
  {t:"s3", q:"What causes day and night on Earth?", o:["Earth rotating on its axis","Earth orbiting the sun","The moon blocking the sun","The tilt of Earth's axis"], why:"Earth spins once every 24 hours, so each side faces toward and then away from the sun."},
  {t:"s4", q:"A student tests whether water temperature affects how fast sugar dissolves. Which should stay the same in every trial?", o:["The amount of water","The water temperature","The time it takes to dissolve","The number of results recorded"], why:"Temperature is what's being changed (independent), and time is what's measured (dependent). The amount of water must stay constant for a fair test."},
  {t:"s4", p:`<b>Hours of light per day → plant growth in 2 weeks</b><br>2 hours → 3 cm<br>4 hours → 6 cm<br>6 hours → 9 cm<br>8 hours → 12 cm`, q:"If the pattern continues, how much would a plant grow with 10 hours of light?", o:["15 cm","12 cm","20 cm","13 cm"], why:"Every 2 extra hours adds 3 cm. So 10 hours → 12 + 3 = 15 cm."},
  {t:"s4", q:"Towns with more firefighters tend to have more fires. What is the best conclusion?", o:["Bigger towns likely have more of both; this doesn't show firefighters cause fires.","Firefighters cause fires.","Towns should get rid of firefighters.","Fires cause towns to shrink."], why:"This is correlation, not causation. A third factor, town size, explains both."},
  {t:"s4", q:"Which change would make an experiment's results more reliable?", o:["Repeating it several times with more test subjects","Changing three variables at once","Skipping the control group","Recording only the best result"], why:"Repeating trials and using larger samples make it less likely the results happened by chance."},
  {t:"s4", q:"In three trials, a ball rolled 42 cm, 45 cm and 48 cm. What was the average distance?", o:["45 cm","42 cm","48 cm","135 cm"], why:"(42 + 45 + 48) ÷ 3 = 135 ÷ 3 = 45 cm."},
  {t:"s4", q:"Hypothesis: \"If students sleep 8 hours, then their test scores will improve.\" What is the dependent variable?", o:["Test scores","Hours of sleep","The students' ages","The type of test"], why:"The dependent variable is what you measure to see if it changes. Here, that's test scores."}
]},
ss:{ mins:50, qs:[
  {t:"ss1", q:"How many senators does each state have in the U.S. Senate?", o:["Two","One","It depends on the state's population","Four"], why:"Every state has two senators. House seats, not Senate seats, are based on population."},
  {t:"ss1", q:"Which power belongs to the states rather than the federal government?", o:["Issuing driver's licenses","Printing money","Declaring war","Making treaties with other countries"], why:"Driver's licenses are handled by each state. The other three are federal powers."},
  {t:"ss1", q:"Which right is protected by the First Amendment?", o:["Freedom of speech","The right to bear arms","Protection from unreasonable searches","The right to vote at age 18"], why:"The First Amendment covers religion, speech, press, assembly and petition."},
  {t:"ss1", q:"The Supreme Court rules that a law goes against the Constitution and strikes it down. What is this power called?", o:["Judicial review","Veto","Impeachment","Federalism"], why:"Judicial review is the courts' power to decide whether laws are constitutional."},
  {t:"ss1", p:`"We the People of the United States, in Order to form a more perfect Union… do ordain and establish this Constitution for the United States of America."<br><i>— Preamble to the U.S. Constitution</i>`, q:"The phrase \"We the People\" best reflects which principle?", o:["Popular sovereignty","Separation of church and state","Judicial review","Checks and balances"], why:"Popular sovereignty means the government's power comes from the people."},
  {t:"ss1", q:"Which part of the federal government has the power to declare war?", o:["Congress","The President","The Supreme Court","State governors"], why:"The Constitution gives Congress the power to declare war. The President is commander in chief of the military."},
  {t:"ss1", q:"A 19-year-old's right to vote in federal elections is protected by which amendment?", o:["26th Amendment","19th Amendment","15th Amendment","1st Amendment"], why:"The 26th Amendment (1971) lowered the voting age to 18."},
  {t:"ss1", q:"Which best describes a representative democracy?", o:["Citizens elect officials to make laws for them.","One person holds all power.","Citizens vote directly on every law.","A small group of wealthy families rules."], why:"In a representative democracy, voters choose leaders who represent them, like members of Congress."},
  {t:"ss1", q:"After the House of Representatives impeaches an official, which body holds the trial?", o:["The Senate","The Supreme Court","The House","The President's Cabinet"], why:"The House brings the charges (impeachment); the Senate holds the trial and decides."},
  {t:"ss1", q:"What must happen for a bill to become a law?", o:["It must pass both the House and the Senate and be signed by the President, or have a veto overridden.","It only needs the President's signature.","It must be approved by the Supreme Court.","It must pass the House only."], why:"Both chambers of Congress must pass it. Then the President signs it, or Congress overrides a veto with a two-thirds vote."},
  {t:"ss1", p:`"Congress shall make no law respecting an establishment of religion, or prohibiting the free exercise thereof…"<br><i>— First Amendment</i>`, q:"What does this part of the First Amendment mean?", o:["The government can't set up an official religion or stop people from practicing their faith.","Everyone must belong to a religion.","Congress chooses the nation's religion.","Religious groups can make laws."], why:"\"Establishment\" means creating an official religion. \"Free exercise\" means the right to practice your faith."},
  {t:"ss1", q:"Which of these is a responsibility of citizens, not just a right?", o:["Serving on a jury when called","Freedom of speech","Freedom of religion","The right to a fair trial"], why:"Jury duty is something citizens are expected to do. The others are rights the Constitution protects."},
  {t:"ss2", q:"The Emancipation Proclamation of 1863 declared freedom for enslaved people in…", o:["the Confederate states","every country in the world","the Northern states only","the western territories only"], why:"It applied to states in rebellion (the Confederacy). The 13th Amendment later ended slavery everywhere in the U.S."},
  {t:"ss2", q:"Susan B. Anthony is best known for her work in which movement?", o:["Women's right to vote","The New Deal","The Cold War","Building the railroads"], why:"Anthony was a leader of the women's suffrage movement, which led to the 19th Amendment."},
  {t:"ss2", q:"Japan's attack on Pearl Harbor on December 7, 1941, led the United States to…", o:["enter World War II","enter World War I","start the Cold War","end the Great Depression immediately"], why:"The U.S. declared war on Japan the next day and entered World War II."},
  {t:"ss2", q:"Which event is most closely linked to the start of the Great Depression?", o:["The stock market crash of 1929","The Civil War","The attack on Pearl Harbor","The signing of the Constitution"], why:"The 1929 crash set off the worst economic downturn in U.S. history."},
  {t:"ss2", q:"Martin Luther King Jr.'s \"I Have a Dream\" speech (1963) is most closely tied to which movement?", o:["The Civil Rights Movement","The women's suffrage movement","The American Revolution","The New Deal"], why:"King gave the speech at the March on Washington, a landmark of the Civil Rights Movement."},
  {t:"ss2", q:"During the Industrial Revolution, many Americans moved from farms to cities to work in factories. This movement is called…", o:["urbanization","colonization","immigration","emancipation"], why:"Urbanization is the growth of cities as people move to them from rural areas."},
  {t:"ss3", q:"A farm harvests a huge crop of pineapples, but demand stays the same. What will most likely happen to pineapple prices?", o:["They will fall.","They will rise.","They will stay exactly the same.","Pineapples will become illegal."], why:"When supply goes up and demand doesn't change, prices usually drop."},
  {t:"ss3", q:"Congress passes a tax cut so people have more money to spend. This is an example of…", o:["fiscal policy","monetary policy","a monopoly","inflation"], why:"Fiscal policy is government using taxes and spending. Monetary policy is the Federal Reserve managing interest rates."},
  {t:"ss3", q:"You borrow $1,000 at 5% simple interest for 2 years. How much interest do you owe?", o:["$100","$50","$1,100","$10"], why:"I = p × r × t = 1,000 × 0.05 × 2 = $100. ($1,100 is the total you'd repay.)"},
  {t:"ss3", q:"Only one company sells internet service in a town, and it keeps raising prices. What is this situation called?", o:["A monopoly","A recession","Fiscal policy","Opportunity cost"], why:"A monopoly is a single company controlling a market. Without competition, it can raise prices."},
  {t:"ss4", q:"Which part of a map helps you measure the distance between two places?", o:["The scale","The compass rose","The legend","The title"], why:"The scale shows how map distance compares to real distance, like 1 inch = 50 miles."},
  {t:"ss4", q:"In the 1800s, many people moved to cities because factory jobs were available. The factory jobs were a…", o:["pull factor","push factor","natural barrier","primary source"], why:"Pull factors attract people to a new place. Push factors drive them away from where they are."},
  {t:"ss4", q:"An ad for a soda says it is \"the best drink on the market.\" What should a careful reader do?", o:["Consider the source's purpose and look for real evidence","Accept it, since it's in an ad","Assume every other drink is bad","Ignore all information about drinks"], why:"The ad's purpose is to sell, so it's biased. Look for evidence before believing a claim."}
]}
};

const ESSAYS = [
{ id:"e1", title:"The four-day work week", issue:"Should employers switch to a four-day work week?",
  a:{h:"A Shorter Week Pays Off", side:"For", text:`When the city of Ridgeport ran a six-month trial of a four-day work week at 40 local companies, the results surprised even the skeptics. According to the city's final report, 35 of the 40 companies chose to keep the shorter schedule after the trial ended. Output stayed level or rose at most of them, and employee sick days fell by nearly a third.<br><br>Dr. Alana Reyes, an economist who reviewed the data, explained that rested workers make fewer costly mistakes. "Companies didn't lose a day of work," she said. "They gained a more focused workforce."<br><br>Workers benefited too. In surveys, 7 in 10 employees reported lower stress, and turnover dropped, saving companies the high cost of hiring and training new staff. A four-day week is not a gift to workers. It is a smart business decision backed by evidence.`},
  b:{h:"Keep the Five-Day Week", side:"Against", text:`The four-day week sounds nice, but it simply won't work for most businesses. Customers expect service five days a week or more, and no one wants to call a business and hear that it's closed on Friday.<br><br>My neighbor's company tried shorter weeks, and he told me everyone was more rushed than ever. Cramming 40 hours into four days means 10-hour shifts, and anyone who has worked a 10-hour shift knows how exhausting that is.<br><br>Supporters talk about happier workers, but a job isn't supposed to be a vacation. Hard work built this country, and cutting the work week sends the wrong message to the next generation. Leaders should reject this trendy idea before it hurts the economy.`} },
{ id:"e2", title:"Phones in school", issue:"Should schools ban phones for the whole school day?",
  a:{h:"Ban Phones in School", side:"For a ban", text:`Phones are destroying students' ability to focus. Walk into any classroom and you'll see kids staring at screens instead of listening. When I was in school, we didn't have phones, and we turned out fine.<br><br>Teachers are fed up, and parents are too. One teacher I spoke with said her students can't go five minutes without checking social media. It's obvious that phones are the reason test scores have dropped.<br><br>Schools need to take a stand and ban phones completely, from the first bell to the last. If students can't handle the responsibility, the school must handle it for them.`},
  b:{h:"Teach Phone Habits Instead", side:"Against a ban", text:`A total phone ban sounds simple, but it creates new problems. In a two-year review by the Westlake School District, schools with full bans showed no clear difference in grades compared with schools that let students keep phones put away during class. What did help? Schools with clear rules, such as phones off during lessons but allowed at lunch, reported 40 percent fewer phone-related discipline problems.<br><br>Phones also meet real needs. In a district survey, 62 percent of parents said they rely on texting to arrange pickups and handle emergencies.<br><br>Principal David Kim notes that bans push phone use out of sight instead of teaching self-control. "Students will have phones at work and in college," he said. "Our job is to prepare them for that." Clear rules, not bans, give students skills they will actually use.`} }
];

const OUTLINE = `Intro: The two passages disagree about ___. Passage __ makes the stronger argument because ___.

Body 1: Passage __'s strongest evidence is ___. This is convincing because ___.

Body 2: Passage __ also supports its claim with ___.

Body 3: Passage __ is weaker because it relies on ___. For example, ___.

Conclusion: Overall, Passage __ is better supported because ___.`;

const CHECKS = [
  {h:"Arguments and evidence", items:["I clearly state which passage is better supported","I use specific evidence from both passages (numbers, quotes, examples)","I explain why the evidence is strong or weak","I point out at least one flaw in the weaker argument"]},
  {h:"Organization", items:["I have an introduction, body paragraphs and a conclusion","Each body paragraph has one main point","I use transitions like however, in addition and as a result"]},
  {h:"Clear writing", items:["My sentences are complete, with no fragments or run-ons","I checked spelling, capital letters and commas","I used formal language, not slang"]}
];

const TIPS = [
  {h:"Before test day", items:["Take one subject at a time. There's no need to do all four together.","Use the full practice tests here until you score well, then take the official GED Ready® practice test.","Schedule your test at GED.com. You can test at a testing center or, in many states, online from home.","Check GED.com for the ID you'll need, and have it ready."]},
  {h:"During the test", items:["Answer every question. A wrong answer doesn't cost you extra points, so never leave one blank.","Flag hard questions and come back to them once you've done the easier ones.","Read the question before the passage so you know what you're looking for.","Cross off answers you know are wrong, then choose from what's left.","Check your pace every 10 questions or so."]},
  {h:"Math", items:["The first few math questions don't allow a calculator. Practice basic arithmetic by hand.","Practice with a TI-30XS-style calculator so it feels familiar on test day.","Stuck? Plug the answer choices back into the problem and see which one works."]},
  {h:"If you feel nervous", items:["Nerves are normal, and they usually mean you care. They don't mean you're unprepared.","Try slow breathing: in for 4 counts, out for 6. Do it three times.","Skip a question that rattles you, flag it and come back. One question won't make or break your score.","If a test doesn't go your way, you can retake just that subject. It's a setback, not the end."]},
  {h:"Take care of yourself", items:["Sleep well the night before. Sleep helps lock in what you studied.","Eat something before you start.","Arrive early, or log in early if you're testing online."]}
];

</script>
<script>
"use strict";
const APP_VERSION = "2.6.0";   // plain X.Y.Z: the tagging workflow and the release check read it
const FEEDBACK_EMAIL = "freeforgood-apps+study@proton.me";
const SITE = "https://freeforgood-apps.github.io/study-coach/";   // the website, for links from the Claude copies
/* ================= question registry ================= */
const QMAP = {};
SUBJECTS.forEach(s => s.units.forEach(u => u.quiz.forEach((q, i) => { q.id = u.id + "." + i; q.sid = s.id; q.uid = u.id; QMAP[q.id] = q; })));
Object.keys(TESTS).forEach(sid => TESTS[sid].qs.forEach((q, i) => { q.id = sid + ".t" + i; q.sid = sid; q.uid = q.t; QMAP[q.id] = q; }));
const isTestQ = q => q.id.indexOf(".t") > -1;

/* ================= storage (this browser only) ================= */
const KEY = (typeof window !== "undefined" && window.STUDY_COACH_KEY) || "ged-study-coach-v1";
const INSTALL_KEY = KEY + "-install";   // "done" once the Make it an app card is dismissed. This device only, so it stays out of backup codes
const DATA_VERSION = 2;   // 2 (Study Coach 2.4): adds bk, for backup reminders
const fresh = () => ({dv:DATA_VERSION, u:{}, mix:{}, last:null, stats:{}, days:{}, miss:{}, tests:{}, active:null, cards:{}, essay:{}, set:{fs:"md"}, bk:{at:"", n:0, snooze:""}});
const isDayKey = s => typeof s === "string" && /^\d{4}-\d\d-\d\d$/.test(s);
// Saved progress and backup codes both come through here, so older data is upgraded the same way and nothing is lost.
function hydrate(d){
  const p = Object.assign(fresh(), d);
  p.set = Object.assign({fs:"md"}, d.set || {});
  delete p.set.safariTip;   // 2.3's Safari note, replaced by the Make it an app card
  const b = d.bk && typeof d.bk === "object" ? d.bk : {};
  p.bk = {at:isDayKey(b.at) ? b.at : "", n:Math.min(Math.max(Math.floor(+b.n) || 0, 0), 9999), snooze:isDayKey(b.snooze) ? b.snooze : ""};
  // From 2.3 or earlier, no backup is on record, so every answer so far counts as not backed up yet
  if (!(d.dv >= 2)) p.bk.n = Math.min(Object.values(p.stats && typeof p.stats === "object" ? p.stats : {}).reduce((a, s) => a + ((s && +s.seen) || 0), 0), 9999);
  p.dv = DATA_VERSION;
  if (p.active && !TESTS[p.active.sid]) p.active = null;
  if (p.active) p.active.run = false;
  return p;
}
let P = fresh();
// Ask the browser to keep Study Coach's data (granted quietly where supported; Firefox would ask, so not there). Website only.
let askedToKeep = false;
function askToKeep(){
  if (askedToKeep) return;
  askedToKeep = true;
  try {
    if (window.self !== window.top || !navigator.storage || !navigator.storage.persist || /Firefox\//.test(navigator.userAgent)) return;
    navigator.storage.persisted().then(p => { if (!p) return navigator.storage.persist(); }).catch(() => {});
  } catch (e) {}
}
// Saved progress that can't be read is set aside under KEY-damaged, never saved over (same as Till Payday).
// holdSave: it couldn't even be set aside, so nothing saves until a copy or backup is restored, or Start fresh.
let damaged = false, holdSave = false, saveFailed = false, loadedRaw = null;
function loadSaved(){
  P = fresh(); damaged = false; holdSave = false; loadedRaw = null;
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("not progress");
    // Someone who dismissed 2.3's Safari note has already seen the Home Screen advice
    if (d.set && d.set.safariTip) try { localStorage.setItem(INSTALL_KEY, "done"); } catch (e) {}
    P = hydrate(d);
    loadedRaw = raw;   // today's automatic copy is taken from this at startup
    if (!(d.dv >= 2)) save();   // save the upgrade once
  } catch (e) {
    P = fresh();
    damaged = true;
    try { localStorage.setItem(KEY + "-damaged", raw); } catch (e2) { holdSave = true; }
  }
}
loadSaved();
function save(){
  if (holdSave) return;
  const json = JSON.stringify(P);
  let ok = false;
  try { localStorage.setItem(KEY, json); ok = localStorage.getItem(KEY) === json; } catch (e) {}
  saveFailed = !ok;
  if (ok) askToKeep();
}

const pad = n => String(n).padStart(2, "0");
const dayKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromDayKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };   // local midnight
const today = () => dayKey(new Date());
function streak(){
  const d = new Date();
  if (!P.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (P.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function record(q, ok){
  const st = P.stats[q.sid] || (P.stats[q.sid] = {seen:0, right:0});
  st.seen++; if (ok) st.right++;
  const k = today(); P.days[k] = (P.days[k] || 0) + 1;
  if (ok) delete P.miss[q.id]; else P.miss[q.id] = 1;
  P.bk.n = Math.min(P.bk.n + 1, 9999);   // answers since the last backup, for backup reminders
}
const missedIds = () => Object.keys(P.miss).filter(id => QMAP[id]);
function applyFS(){ document.documentElement.style.fontSize = P.set.fs === "lg" ? "118.75%" : "106.25%"; }

/* ================= helpers ================= */
const subj = id => SUBJECTS.find(s => s.id === id);
function findUnit(uid){ for (const s of SUBJECTS){ const i = s.units.findIndex(u => u.id === uid); if (i > -1) return {s, u:s.units[i], i}; } return null; }
function prog(s){ return {done: s.units.filter(u => P.u[u.id] && P.u[u.id].done).length, total: s.units.length}; }
const cvar = s => `--c:var(${s.color})`;
const glyph = s => `<span class="glyph${s.glyphSm ? " sm" : ""}">${s.glyph}</span>`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function fmtTime(ms){ const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wc = t => { t = (t || "").trim(); return t ? t.split(/\s+/).length : 0; };
const fmtDate = d => new Date(d).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const svg = (d, w = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  back: svg(`<path d="M15 5l-7 7 7 7"/>`, 2.4),
  close: svg(`<path d="M6 6l12 12M18 6L6 18"/>`, 2.4),
  chev: `<span class="chev">${svg(`<path d="M9 5l7 7-7 7"/>`, 2.4)}</span>`,
  check: svg(`<path d="M5 12.5l4.5 4.5L19 7.5"/>`, 3),
  arrow: svg(`<path d="M5 12h14M13 6l6 6-6 6"/>`, 2.4),
  bulb: svg(`<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0 0 12 3z"/>`),
  book: svg(`<path d="M3 5.5c3-1.5 6-1.5 9 0v14c-3-1.5-6-1.5-9 0z"/><path d="M21 5.5c-3-1.5-6-1.5-9 0v14c3-1.5 6-1.5 9 0z"/>`),
  clip: svg(`<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 13l2.5 2.5 4.5-5"/>`),
  apps: svg(`<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>`),
  chart: svg(`<path d="M5 20V11M12 20V4M19 20v-6"/>`, 2.6),
  calc: svg(`<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" stroke-width="2.8"/>`),
  flag: svg(`<path d="M5 21V4h11l-2 4 2 4H5"/>`),
  pause: svg(`<path d="M9 5v14M15 5v14"/>`, 2.6),
  play: svg(`<path d="M7 5l12 7-12 7z"/>`),
  cards: svg(`<rect x="3" y="7" width="13" height="13" rx="2"/><path d="M8 3.5h11a2 2 0 0 1 2 2v11"/>`),
  pi: svg(`<path d="M4 6h16M9 6c0 6-1 10-4 13M15 6v10.5c0 1.5.8 2.5 2.5 2.5"/>`),
  pen: svg(`<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>`),
  shuffle: svg(`<path d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.6 0 2.8-1.6 3.8-3.6M14 9.5C15 8 16 7 17 7h3"/><path d="M18 4.5l2.5 2.5L18 9.5M18 14.5l2.5 2.5-2.5 2.5"/>`),
  redo: svg(`<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/>`),
  cap: svg(`<path d="M2 9.5L12 5l10 4.5L12 14z"/><path d="M6.5 11.5v4.5c3 2 8 2 11 0v-4.5"/><path d="M21 10v5"/>`),
  info: svg(`<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.01"/>`, 2.4),
  speaker: svg(`<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>`),
  stop: svg(`<rect x="7" y="7" width="10" height="10" rx="1.5"/>`),
  bolt: svg(`<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>`),
  mail: svg(`<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>`),
  cal: svg(`<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>`),
  flame: svg(`<path d="M12 3c.8 3 4.5 4.8 4.5 9a4.5 4.5 0 0 1-9 0c0-2.2 1.1-3.6 2-4.5.3 1.6 1.2 2.5 2.4 2.5C12 7.6 10.8 5.6 12 3z"/>`)
};

/* ================= read aloud ================= */
const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
let speaking = false;
function listenLabel(){ return speaking ? `${I.stop}<span>Stop</span>` : `${I.speaker}<span>Listen</span>`; }
const listenBtn = () => canSpeak ? `<button class="listen" data-act="listen" aria-label="${speaking ? "Stop reading" : "Read aloud"}">${listenLabel()}</button>` : "";
function syncListen(){ const b = document.querySelector('[data-act="listen"]'); if (b){ b.innerHTML = listenLabel(); b.setAttribute("aria-label", speaking ? "Stop reading" : "Read aloud"); } }
function stopSpeak(){ if (!canSpeak) return; try { speechSynthesis.cancel(); } catch (e) {} speaking = false; }
function speak(text){
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.lang = "en-US";
    u.onend = u.onerror = () => { speaking = false; syncListen(); };
    speaking = true; speechSynthesis.speak(u);
  } catch (e) { speaking = false; }
}
const strip = html => { const d = document.createElement("div"); d.innerHTML = String(html).replace(/<br\s*\/?>/gi, ". ").replace(/<\/(li|p|div|h3)>/gi, ". "); return d.textContent.replace(/\s+/g, " ").replace(/(\.\s*){2,}/g, ". ").trim(); };
function readText(v){
  if (v.v === "lesson"){ const u = findUnit(v.id).u; return [u.title + "."].concat(u.lesson.map(x => x.h + ". " + strip(x.html)), ["Test tip. " + u.tip]).join(" "); }
  let q = null, opts = [];
  if (v.v === "quiz"){ q = v.qs[v.i]; opts = q.opts.map(o => o.t); }
  else if (v.v === "test" && P.active){ q = TESTS[P.active.sid].qs[P.active.i]; opts = P.active.ord[P.active.i].map(k => q.o[k]); }
  if (!q) return "";
  return (q.p ? strip(q.p) + " " : "") + strip(q.q) + " " + opts.map((o, j) => "Choice " + "ABCD"[j] + ". " + strip(o) + ".").join(" ");
}

/* ================= study pace ================= */
function daysUntil(d){ const n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((fromDayKey(d) - n) / 86400000); }
function paceText(){
  if (!P.set.date) return "";
  const d = daysUntil(P.set.date);
  const total = SUBJECTS.reduce((a, s) => a + s.units.length, 0), left = total - SUBJECTS.reduce((a, s) => a + prog(s).done, 0);
  if (isNaN(d)) return "";
  if (d < 0) return "Your test date has passed. Set a new one in Progress when you're ready.";
  if (d === 0) return "Test day is today. You've prepared for this. Breathe, and take it one question at a time.";
  const when = d === 1 ? "1 day to your test." : d + " days to your test.";
  if (!left) return when + " Every lesson is done, so focus on full practice tests.";
  if (d < 7) return `${when} ${left} lesson${left === 1 ? "" : "s"} left. Focus on your weakest subject first.`;
  const per = Math.ceil(left / (d / 7));
  return `${when} ${left} lesson${left === 1 ? "" : "s"} left, about ${per} a week.`;
}

/* ================= keep your progress safe: Home Screen card + backup reminders ================= */
/* Worded and timed like Till Payday's, so the free apps match. */
// The website itself. The Claude copies run inside a frame, where Home Screen advice doesn't apply.
const WEB = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
function isStandalone(){ try { return navigator.standalone === true || matchMedia("(display-mode: standalone)").matches; } catch (e) { return false; } }
function isIOS(){ const ua = navigator.userAgent || ""; return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); }
let installHidden = false;
try { installHidden = localStorage.getItem(INSTALL_KEY) === "done"; } catch (e) {}
function installDone(){ installHidden = true; try { localStorage.setItem(INSTALL_KEY, "done"); } catch (e) {} }
let installEvt = null;   // Chrome's own install prompt, when it offers one (Android and computers)
const dayPlus = n => { const d = new Date(); d.setDate(d.getDate() + n); return dayKey(d); };
const agoText = days => days <= 0 ? "today" : days === 1 ? "yesterday" : days + " days ago";
// A first nudge once there's progress worth keeping, a reminder after a week of studying (or lots of questions),
// and a firmer one after a month. "Later" waits 3 days, or 1 day once a backup is overdue.
function backupNeed(){
  const b = P.bk, days = b.at ? -daysUntil(b.at) : null;
  let level = "";
  if (!b.at) level = b.n >= 10 ? "first" : "";
  else if (days >= 30 && b.n >= 1) level = "overdue";
  else if ((days >= 7 && b.n >= 25) || b.n >= 100) level = "due";
  const snoozed = !!b.snooze && b.snooze > today();
  return {level, days, n:b.n, card:!!level && !snoozed};
}
function markBackedUp(){ P.bk = {at:today(), n:0, snooze:""}; }
// One card at a time on Home: damaged or unsaved progress comes first, then a due backup, then the Home Screen card (website only, after the welcome card)
function keepSafeCard(){
  if (damaged) return `<section class="note warnnote" id="damagedcard" role="alert"><span class="label">Couldn't read your saved progress</span><b>Your progress is set aside, not lost</b><span class="small">Something damaged the copy saved on this device, so Study Coach kept it aside instead of saving over it. Restore one of the automatic copies or a backup, or start fresh.</span>
      <div class="noteacts"><button class="btn sm" data-act="damagedrestore" style="--c:var(--ink)">See saved copies</button><button class="btn sm ghost" data-act="damagedfresh">Start fresh</button></div></section>`;
  if (saveFailed) return `<section class="note warnnote" id="savewarn" role="alert"><span class="label">Not saving on this device</span><b>Your progress isn't being saved here</b><span class="small">This can happen in a private browsing window, or when the phone's storage is full. Save a backup now so you don't lose your progress.</span>
      <div class="noteacts"><button class="btn sm" data-act="bknow" style="--c:var(--ink)">Back up now</button></div></section>`;
  const bk = backupNeed();
  if (bk.card){
    const extra = WEB && isIOS() && !isStandalone() ? " Adding Study Coach to your Home Screen helps too." : "";
    const [title, head, sub] = bk.level === "first"
      ? ["Keep your progress safe", "Save a backup of your progress", "Your progress is only on this device. If the browser clears its data or you get a new phone, a backup code brings it right back. It takes a few seconds."]
      : bk.level === "due"
      ? ["Backup reminder", "Time for a quick backup", `You've answered ${bk.n === 1 ? "1 question" : bk.n + " questions"} since your last backup ${agoText(bk.days)}.`]
      : ["Backup reminder", `It's been ${bk.days} days since your last backup`, "Save a fresh one so your recent progress is safe too."];
    return `<section class="note warnnote" id="bkcard"><span class="label">${title}</span><b>${head}</b><span class="small">${sub}${extra}</span>
      <div class="noteacts"><button class="btn sm" data-act="bknow" style="--c:var(--ink)">Back up now</button><button class="btn sm ghost" data-act="bklater">Later</button></div></section>`;
  }
  if (!WEB || installHidden || isStandalone() || !P.seen) return "";
  const text = isIOS()
    ? "Add Study Coach to your Home Screen. It opens like an app, works without internet, and keeps Safari from clearing your progress after a week away."
    : "Add Study Coach to your Home Screen. It opens like an app and works without internet.";
  return `<section class="note" id="installcard"><b>Make it an app</b><span class="small muted">${text}</span>
    <div class="noteacts">${installEvt ? `<button class="btn sm" data-act="install" style="--c:var(--ink)">Install</button>` : `<button class="btn sm ghost" data-act="installhow">Show me how</button>`}<button class="btn sm ghost" data-act="installdone">Got it</button></div></section>`;
}
// The About section the card's "Show me how" opens to
function keepSafeTips(){
  const backup = ["Back up now and then. ", "The Progress tab has Back up and Restore, and Study Coach reminds you when it's been a while."];
  const tips = WEB ? [
    ["iPhone or iPad: ", "open Study Coach in Safari, tap Share, then Add to Home Screen."],
    ["Android: ", "open it in Chrome, tap the ⋮ menu, then Add to Home screen or Install app."],
    ["Safari can clear saved data ", "from websites you haven't opened in 7 days. The Home Screen app keeps its own data, so it avoids that."],
    backup
  ] : [backup];
  return `<section class="sec" id="keepsafe"><h3>Keep your progress safe</h3><ul>${tips.map(([b, t]) => `<li><b>${b}</b>${t}</li>`).join("")}</ul></section>`;
}
// The Claude copies are retired (Nov 2026): point people to the website. Only shows outside the website (WEB is false in a frame).
function movedCard(){
  if (WEB) return "";
  return `<section class="note" id="movedcard"><b>Study Coach has moved</b><span class="small">This copy inside Claude won't get updates anymore. Your progress is still here, and it keeps working.</span>
    <span class="small">The free website gets every update, works without internet, and can go on your Home Screen: freeforgood-apps.github.io/study-coach</span>
    <span class="small">To bring your progress along, copy a backup code here. Then open the website, go to the Progress tab, tap Restore, and paste the code.</span>
    <div class="noteacts"><button class="btn sm" data-act="bknow" style="--c:var(--ink)">Get my backup code</button><a class="btn sm ghost" href="${SITE}" target="_blank" rel="noopener">Open the website</a></div></section>`;
}

function promptInstall(){

  try {

  } catch (e) { showKeepSafe(); return; }
  render(false);
}

/* ================= QUIZ (lesson, mixed, missed, everything) ================= */
function prep(q){ return Object.assign({}, q, {opts: shuffle(q.o.map((t, k) => ({t, ok: k === 0})))}); }
function makeQuiz(mode, sid, uid){
  let pool, title;
  if (mode === "lesson"){ const f = findUnit(uid); pool = f.u.quiz; title = f.u.title; }
  else if (mode === "mix"){ pool = shuffle(subj(sid).units.flatMap(u => u.quiz)).slice(0, 10); title = subj(sid).name + " · Mixed practice"; }
  else if (mode === "quick"){
    const miss = shuffle(missedIds().map(id => QMAP[id])).slice(0, 2), ids = new Set(miss.map(q => q.id));
    pool = shuffle(miss.concat(shuffle(Object.values(QMAP).filter(q => !isTestQ(q) && !ids.has(q.id))).slice(0, 5 - miss.length)));
    title = "Quick 5";
  }
  else if (mode === "all"){ pool = shuffle(Object.values(QMAP).filter(q => !isTestQ(q))).slice(0, 15); title = "Everything mix"; }
  else { pool = shuffle(missedIds().map(id => QMAP[id])).slice(0, 15); title = "Missed questions"; }
  return {v:"quiz", mode, sid, uid, title, qs: pool.map(prep), i:0, picked:null, score:0, wrongs:[]};
}

function vQuiz(v){
  const q = v.qs[v.i], s = subj(q.sid), n = v.qs.length, answered = v.picked !== null;
  const opts = q.opts.map((o, k) => {
    let cls = "";
    if (answered) cls = o.ok ? "right" : (k === v.picked ? "wrong" : "dim");
    return `<button class="opt ${cls}" data-act="pick" data-i="${k}"${answered ? " disabled" : ""}><span class="L">${"ABCD"[k]}</span><span>${o.t}</span></button>`;
  }).join("");
  let fb = "";
  if (answered){
    const ok = q.opts[v.picked].ok, right = q.opts.find(o => o.ok).t;
    fb = `<div class="fb ${ok ? "good" : "bad"}" aria-live="polite"><h4>${ok ? "Correct!" : "Not quite"}</h4>${ok ? "" : `<p><b>Answer:</b> ${right}</p>`}<p>${q.why}</p><button class="linkbtn sm" data-act="report" data-id="${q.id}">${I.flag} Think this question has a mistake? Report it</button></div>
      <button class="btn" id="fbnext" data-act="next">${v.i < n - 1 ? `Next question ${I.arrow}` : "See my results"}</button>`;
  }
  const tag = (v.mode === "all" || v.mode === "miss") ? `<span class="eyebrow">${s.name}</span>` : "";
  return page(cvar(s), topbar(v.title, {close:true, right:`<div class="topright">${v.i + 1} of ${n}</div>${q.sid !== "rla" ? calcBtn : ""}`}) + `<main class="screen">
    <div class="qtrack"><div style="width:${(v.i + (answered ? 1 : 0)) / n * 100}%"></div></div>
    <div class="qtools">${tag || "<span></span>"}${listenBtn()}</div>
    ${q.p ? `<div class="passage"><span class="eyebrow">Read this</span>${q.p}</div>` : ""}
    <p class="qtext">${q.q}</p>
    <div class="opts">${opts}</div>
    <p class="kbd small muted">Keyboard: press A–D to answer${answered ? ", then Enter for the next question" : ""}.</p>
    ${fb}
  </main>${v.rep ? reportSheet(v.rep) : ""}`);
}

function vResults(v){
  const s = v.sid ? subj(v.sid) : null, p = v.score / v.n;
  const msg = p >= 0.8 ? ["Great work", "You've got this down. Keep the momentum going."]
    : p >= 0.6 ? ["Solid progress", "Look over the ones you missed below, then try again."]
    : ["Keep going", "Reread the lesson, then give it another shot. Every retry helps it stick."];
  let next = "";
  if (v.mode === "lesson"){ const f = findUnit(v.uid), nu = f.s.units[f.i + 1]; if (nu) next = `<button class="btn" data-act="nextlesson" data-id="${nu.id}">Next lesson: ${nu.title}</button>`; }
  const canRetry = v.mode !== "miss" || missedIds().length > 0;
  const backBtn = s ? `<button class="btn ghost" data-act="tosubject" data-id="${s.id}">Back to ${s.name}</button>` : `<button class="btn ghost" data-act="toroot">Done</button>`;
  const misses = v.wrongs.length
    ? `<div class="label">Review what you missed</div><div class="list">${v.wrongs.map(w => `<div class="miss"><p><b>${w.q}</b></p><p class="ans">${I.check}<span>${w.a}</span></p><p class="small muted">${w.why}</p></div>`).join("")}</div>`
    : (v.mode === "miss" ? `<p class="center muted">You cleared every question you'd missed. Nice work.</p>` : "");
  return page(s ? cvar(s) : "--c:var(--ink)", topbar(s ? s.name : "Practice") + `<main class="screen">
    <section class="score"><span class="eyebrow">${v.title}</span>
      <div class="big">${v.score}<span>/${v.n}</span></div><h2>${msg[0]}</h2><p class="muted">${msg[1]}</p></section>

    ${misses}
  </main>`);
}

function startTest(sid, timed){
  const T = TESTS[sid];
  P.active = {sid, ord: T.qs.map(q => shuffle(q.o.map((_, k) => k))), ans: T.qs.map(() => null), flag: T.qs.map(() => false), i:0, used:0, limit: timed ? T.mins * 60000 : null, run:true, lt: Date.now()};
  save();
  tab = "practice"; stacks.practice = [{v:"practice"}, {v:"test"}];
  render(true);
}
function resumeTest(){
  const A = P.active; if (!A) return;
  A.run = true; A.lt = Date.now();
  tab = "practice"; stacks.practice = [{v:"practice"}, {v:"test"}];
  render(true);
}
function commit(){ const A = P.active; if (A && A.run){ const now = Date.now(); A.used += now - A.lt; A.lt = now; } }

function vTest(v){
  const A = P.active;
  if (!A) return page("--c:var(--ink)", topbar("Practice test") + `<main class="screen"><p>There's no test in progress.</p><button class="btn" data-act="toroot">Back to Practice</button></main>`);
  const s = subj(A.sid), T = TESTS[A.sid], n = T.qs.length, q = T.qs[A.i], ord = A.ord[A.i], sel = A.ans[A.i];
  const answered = A.ans.filter(x => x !== null).length, unanswered = n - answered, flagged = A.flag.filter(Boolean).length;
  const opts = ord.map((k, j) => `<button class="opt ${sel === j ? "sel" : ""}" data-act="tpick" data-i="${j}" aria-pressed="${sel === j}"><span class="L">${"ABCD"[j]}</span><span>${q.o[k]}</span></button>`).join("");
  const left = A.limit ? A.limit - A.used : 0;
  const timer = `<button class="timer${A.limit && left < 300000 ? " low" : ""}" data-act="tpause" aria-label="Pause test">${I.pause}<span id="timer">${A.limit ? fmtTime(left) : fmtTime(A.used)}</span></button>`;
  let sheet = "";
  if (v.sheet === "nav"){
    const cells = A.ans.map((x, i) => `<button class="cell${x !== null ? " ans" : ""}${A.flag[i] ? " fl" : ""}${i === A.i ? " cur" : ""}" data-act="tjump" data-i="${i}" aria-label="Question ${i + 1}${x !== null ? ", answered" : ", not answered"}${A.flag[i] ? ", flagged" : ""}">${i + 1}</button>`).join("");
    sheet = overlay(`<div class="shd"><h2>Questions</h2><button class="iconbtn" data-act="tsheetclose" aria-label="Close">${I.close}</button></div>

function submitTest(auto){
  const A = P.active; if (!A) return;
  commit(); A.run = false;
  const T = TESTS[A.sid];
  let score = 0;
  T.qs.forEach((q, i) => { const j = A.ans[i]; const ok = j !== null && A.ord[i][j] === 0; if (ok) score++; record(q, ok); });
  const used = A.limit ? Math.min(A.used, A.limit) : A.used;
  const att = {d: Date.now(), score, n: T.qs.length, secs: Math.round(used / 1000), ans: A.ans.slice(), ord: A.ord, timed: !!A.limit, auto: !!auto};
  const h = P.tests[A.sid] || (P.tests[A.sid] = []);
  h.push(att); if (h.length > 10) h.shift();
  const sid = A.sid;
  P.active = null; save();
  tab = "practice"; stacks.practice = [{v:"practice"}, {v:"tres", sid, k: h.length - 1, filter:"miss"}];
  render(true);
}

function vTestResult(v){

/* ================= BACKUP ================= */
const b64e = str => { const b = new TextEncoder().encode(str); let bin = ""; b.forEach(x => { bin += String.fromCharCode(x); }); return btoa(bin); };
const b64d = str => new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0)));
function exportCode(){ return "SC1." + b64e(JSON.stringify(P)); }
// Reads a backup code without using it, so a bad code is caught before the confirm tap
function parseCode(raw){
  const str = (raw || "").replace(/\s+/g, "");
  if (str.indexOf("SC1.") !== 0) throw new Error("prefix");
  const d = JSON.parse(b64d(str.slice(4)));
  if (!d || typeof d !== "object" || typeof d.u !== "object") throw new Error("shape");
  return d;
}
function importCode(raw){ applyRestored(parseCode(raw), true); }
// Every restore (backup code, backup file or automatic copy) comes through here
function applyRestored(d, isBackup){
  essayRun = null;
  P = hydrate(d);
  if (isBackup) markBackedUp();   // what's on this device now matches a backup. A copy from this device isn't one, so reminders keep counting
  damaged = false; holdSave = false;
  save(); applyFS();
}
// Anything that replaces progress takes two taps, unless there's nothing here to lose yet
const hasProgress = () => ["u", "stats", "tests", "essay", "cards"].some(k => P[k] && Object.keys(P[k]).length > 0);
const needsConfirm = () => hasProgress() && !damaged;
// First tap: the button's words change for 5 seconds. Returns true once it's armed and tapped again.
function armed(btn, text){
  const label = btn.querySelector(".al") || btn;
  if (btn.classList.contains("armed")) return true;
  btn.dataset.was = label.textContent; label.textContent = text; btn.classList.add("armed");
  setTimeout(() => disarm(btn), 5000);
  return false;
}
function disarm(btn){
  if (!btn || !btn.classList.contains("armed")) return;
  (btn.querySelector(".al") || btn).textContent = btn.dataset.was;
  btn.classList.remove("armed");
}
function setBkMsg(text, cls){ const m = document.getElementById("bkmsg"); if (m){ m.textContent = text; m.className = "small " + (cls || "muted"); } }
function refreshBkLine(){ const l = document.getElementById("bkline"); if (l) l.textContent = "Last backup: " + fmtDate(fromDayKey(P.bk.at)) + " (" + agoText(-daysUntil(P.bk.at)) + ")"; }

// Backup file: the same code in a small text file, through the share sheet (Files, iCloud Drive, email) or a download. Website only.
function saveBackupFile(){
  const text = exportCode() + "\n", name = "study-coach-backup-" + today() + ".txt";
  const done = msg => { markBackedUp(); save(); refreshBkLine(); setBkMsg(msg, "okmsg"); };
  try {
    const file = new File([text], name, {type:"text/plain"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:"Study Coach backup"})
        .then(() => done("Backup saved. Keep it somewhere safe."), e => { if (!e || e.name !== "AbortError") downloadFile(text, name, done); });
      return;
    }
  } catch (e) {}
  downloadFile(text, name, done);
}
function downloadFile(text, name, done){
  try {
    const url = URL.createObjectURL(new Blob([text], {type:"text/plain"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done("Backup file saved to your downloads.");
  } catch (e) { setBkMsg("Couldn't save a file here. Copy the code instead.", "errmsg"); }
}
function readBackupFile(input){
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  if (f.size > 5e6){ setBkMsg("That file is too big to be a Study Coach backup.", "errmsg"); return; }
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result || "").trim(), ta = document.getElementById("bkin");
    if (!ta) return;
    try { parseCode(text); } catch (e) { setBkMsg("That file isn't a Study Coach backup.", "errmsg"); return; }
    ta.value = text;
    disarm(document.querySelector('[data-act="bkrestore"]'));
    setBkMsg("Backup loaded. Tap Restore to use it.");
  };
  r.onerror = () => setBkMsg("Couldn't read that file.", "errmsg");
  r.readAsText(f);
}

/* Automatic copies: one from each of the last 3 days Study Coach was opened, kept on this device (same as Till Payday) */
const COPIES_KEY = KEY + "-copies";
function readCopies(){
  try {
    const a = JSON.parse(localStorage.getItem(COPIES_KEY) || "[]");
    return Array.isArray(a) ? a.filter(c => c && typeof c.p === "string" && isDayKey(c.day)) : [];
  } catch (e) { return []; }
}
function keepDailyCopy(json){
  try {
    const day = today();
    let copies = readCopies();
    if (copies.some(c => c.day === day) || (copies.length && copies[0].p === json)) return;
    copies.unshift({day, at:new Date().toISOString(), p:json});
    copies = copies.slice(0, 3);
    for (let tries = 0; tries < 3; tries++){   // if storage is full, keep fewer copies
      try { localStorage.setItem(COPIES_KEY, JSON.stringify(copies)); return; }
      catch (e) { copies = copies.slice(0, copies.length - 1); if (!copies.length) return; }
    }
  } catch (e) {}
}
function restoreCopy(i){
  const c = readCopies()[i];
  if (!c) throw new Error("missing");
  const d = JSON.parse(c.p);
  if (!d || typeof d !== "object" || typeof d.u !== "object") throw new Error("shape");
  applyRestored(d, false);
  return c;
}
function copiesHTML(){
  const copies = readCopies();
  if (!copies.length) return "";
  const btns = copies.map((c, i) => {
    const ago = -daysUntil(c.day), at = new Date(c.at);
    const when = ago === 0 ? "Today" : ago === 1 ? "Yesterday" : fmtDate(fromDayKey(c.day));
    const time = isNaN(at) ? "" : " at " + at.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    return `<button class="btn ghost copy" data-act="copyrestore" data-id="${i}"><span class="al">${when}, when you first opened it</span><small>${fmtDate(fromDayKey(c.day))}${time}</small></button>`;
  }).join("");
  return `<div class="copies" id="copies"><h4>Automatic copies</h4><p class="small muted">Study Coach keeps a copy of your progress from each of the last 3 days you opened it, right here on this device. Handy if something goes wrong.</p>
    ${btns}<p class="small muted" id="copymsg" aria-live="polite"></p><button class="linkbtn" data-act="copiesdelete">Delete these copies</button></div>`;
}
